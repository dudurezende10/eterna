/* Layout: fixed left rail with wordmark, the perfis and the gestão sub-sections; one scrolling column of content, summary before detail. */

  --good:#8fcb9d; --warn:#dcbb62; --bad:#ee9479; --good-bg:#1f2e23; --warn-bg:#2f2812; --bad-bg:#3a211b; --bar:#f2eee7; --bar2:#4a443c; color-scheme:dark } }
:root[data-theme="dark"]{

  --good:#8fcb9d; --warn:#dcbb62; --bad:#ee9479; --good-bg:#1f2e23; --warn-bg:#2f2812; --bad-bg:#3a211b; --bar:#f2eee7; --bar2:#4a443c; color-scheme:dark }
*{box-sizing:border-box}

.modal{position:fixed;inset:0;background:rgba(10,9,8,.86);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}

// ---------- charts ----------
function barChart(items,opts={}){
  const W=opts.w||640,H=opts.h||200,padL=58,padB=28,padT=24;const max=Math.max(...items.map(i=>i.v))||1;const n=items.length;const bw=(W-padL-8)/n;
  const ticks=[0,.5,1].map(t=>Math.round(max*t));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label||'')}" style="display:block;max-width:100%">`;
  ticks.forEach(t=>{const y=padT+(H-padT-padB)*(1-t/max);s+=`<line x1="${padL}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y+4}" text-anchor="end">${opts.fmt?opts.fmt(t):t}</text>`});
  items.forEach((it,i)=>{const h=(H-padT-padB)*it.v/max;const x=padL+i*bw+bw*.15,y=padT+(H-padT-padB)-h;s+=`<rect x="${x}" y="${y}" width="${bw*.7}" height="${h}" rx="3" fill="${it.dim?'var(--bar2)':'var(--bar)'}"><title>${esc(it.label)}: ${opts.fmt?opts.fmt(it.v):it.v}</title></rect>`;
    if(opts.values)s+=`<text x="${x+bw*.35}" y="${y-5}" text-anchor="middle" style="fill:var(--fg)">${opts.fmt?opts.fmt(it.v):it.v}</text>`;
    s+=`<text x="${x+bw*.35}" y="${H-8}" text-anchor="middle">${esc(it.label)}</text>`});
  return s+'</svg>';
}
function sparkIdx(perDay){
  const W=200,H=54,n=perDay.length,bw=W/n;const vals=perDay.map(p=>p.off?null:p.index);const max=Math.max(140,...vals.filter(v=>v!=null));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:100%" role="img" aria-label="índice por dia">`;
  const y100=H-10-(H-14)*100/max;s+=`<line x1="0" x2="${W}" y1="${y100}" y2="${y100}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
  vals.forEach((v,i)=>{const x=i*bw+bw*.2;if(v==null){s+=`<rect x="${x}" y="${H-12}" width="${bw*.6}" height="2" fill="var(--line)"/>`;return}const h=(H-14)*v/max;s+=`<rect x="${x}" y="${H-10-h}" width="${bw*.6}" height="${h}" rx="2" fill="${v>=100?'var(--bar)':'var(--bar2)'}"><title>${dlabel(perDay[i].date)}: ${v}</title></rect>`});
  return s+'</svg>';
}
function hbars(items,fmt){const max=Math.max(...items.map(i=>i.v))||1;return `<div class="bars">${items.map(i=>`<div class="bar"><span>${esc(i.label)}</span><div class="track"><div class="fill" style="width:${100*i.v/max}%"></div></div><span class="val">${fmt?fmt(i.v):i.v}</span></div>`).join('')}</div>`}
function quality(key){const rs=Object.values(state.reviews).filter(r=>r.key===key);const ph=rs.flatMap(r=>Object.values(r.photos||{}));const good=ph.filter(v=>v===1).length,bad=ph.filter(v=>v===-1).length;const scored=rs.filter(r=>r.score);return {sessions:rs.length,rated:good+bad,good,bad,goodPct:(good+bad)?Math.round(100*good/(good+bad)):null,score:scored.length?(scored.reduce((a,r)=>a+r.score,0)/scored.length):null}}

const PAY_W=[['Cartão de crédito',56],['PIX',24],['Cartão de débito',12],['Dinheiro',8]];
function reconSale(s,i){
  const h=h32(s.card+'s');const sold=s.sold;let items=[];
  if(sold>=s.n&&sold>=7)items=['mais'];else if(sold>=6){items=['maracana'];for(let k=6;k<Math.min(sold,9);k++)items.push('extra');}
  else if(sold>=3){items=['zona'];for(let k=3;k<sold;k++)items.push('extra');}else{items=['arq'];for(let k=1;k<sold;k++)items.push('extra');}
  let r=h%100,pay=PAY_W[0][0],acc=0;for(const [n,w] of PAY_W){acc+=w;if(r<acc){pay=n;break;}}
  const seller=SELLERS[(h>>>3)%SELLERS.length];
  const total=items.reduce((a,id)=>a+priceOf(id),0);const prints=items.reduce((a,id)=>{const c=DATA.catalog.find(x=>x.id===id);return a+(c?c.prints:0)},0);
  return {no:`R${s.date.slice(5).replace('-','')}-${String(i+1).padStart(3,'0')}`,date:s.date,time:s.time,card:s.card,key:s.key,pdv:s.pdv,seller,items,photos:sold,prints,pay,total,status:'paga',est:true};
}

function vGuestSelfie(){const sf=state.guest.selfie;
  const body=sf.shot?`<img class="selfshot" src="${sf.shot}" alt="Sua selfie">`:sf.err?`<div class="selfcam off"><div class="ring"></div></div>`:`<div class="selfcam"><video id="gself-video" autoplay muted playsinline></video><div class="ring"></div></div>`;
  return `<div class="head"><div><div class="eyebrow"><button class="chip" data-act="gself-close">← Voltar</button></div><h1>Selfie</h1></div></div>
  <div class="phone"><div class="pin">${cobrand(40)}
    <div><h2 style="font-size:26px">${sf.shot?'Procurando suas fotos...':sf.err?'Mande uma selfie':'Olhe para a câmera'}</h2><div class="note">${sf.shot?'Comparando o seu rosto com as fotos do dia.':sf.err?esc(sf.err):'Encaixe o rosto no círculo, sem óculos escuros nem boné.'}</div></div>
    ${body}
    ${sf.shot?'':sf.err?`<label class="btn primary big" for="gselfie" style="cursor:pointer">Escolher uma foto do aparelho<input type="file" id="gselfie" accept="image/*" capture="user" data-act="guest-selfie" hidden></label>`:`<button class="btn primary big" data-act="gself-snap" ${sf.ready?'':'disabled'}>Tirar foto</button>`}
    <div class="note">A selfie serve só para achar as suas fotos (LGPD). Não fica guardada.</div>
  </div></div>`;}
async function selfieStart(){const sf=state.guest.selfie;if(!sf||sf.stream||sf.err)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){sf.err='Este navegador não abre a câmera. Escolha uma foto do aparelho.';render();return;}
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},audio:false});
    if(!state.guest.selfie){st.getTracks().forEach(t=>t.stop());return;}sf.stream=st;selfieMount();}
  catch(e){sf.err=e&&e.name==='NotAllowedError'?'A câmera foi bloqueada. Libere o acesso no navegador ou escolha uma foto do aparelho.':'Nenhuma câmera encontrada. Escolha uma foto do aparelho.';render();}}
function selfieMount(){const sf=state.guest.selfie;const v=$('#gself-video');if(!sf||!v)return;if(!sf.stream){selfieStart();return;}
  if(v.srcObject!==sf.stream){v.srcObject=sf.stream;v.onloadeddata=()=>{if(!sf.ready){sf.ready=true;const b=$('[data-act="gself-snap"]');if(b)b.disabled=false;}};v.play().catch(()=>{});}
  if(sf.ready){const b=$('[data-act="gself-snap"]');if(b)b.disabled=false;}}
function selfieStop(){const sf=state.guest.selfie;if(sf&&sf.stream)sf.stream.getTracks().forEach(t=>t.stop());state.guest.selfie=null;}
function selfieFound(){setTimeout(()=>{if(!state.guest.selfie)return;const paid=Object.entries(SIM.sessions).filter(([c,x])=>x.status==='paga').map(([c])=>c);selfieStop();state.guest.code=paid[0]||DATA.sampled[0].card;toast('Encontramos a sua sessão');render();},1400);}
function vConvidado(){

const TAGS=['Luz','Enquadramento','Pose','Expressão','Foco','Fundo','Horizonte','Grupo cortado'];
function vRevisao(){

  if(state.session){const s=DATA.sampled.find(x=>x.card===state.session);if(!s){state.session=null;return vRevisao();}

        <div class="photos">${s.photos.map((p,i)=>photoBtn(p,{act:'rate',v:r.photos&&r.photos[p.id]||0,tag:p.sold?'VENDIDA':'',label:'Foto '+(i+1)})).join('')}</div></div>
      <div class="panel"><h2>Sessão</h2>

  ${DATA.sessions.filter(s=>P[s.key].human&&(f.key==='all'||s.key===f.key)&&(f.date==='all'||s.date===f.date)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(s=>`<tr><td>${dlabel(s.date)}</td><td>${s.time}</td><td>${esc(P[s.key].name)}</td><td>${s.card?esc(s.card):'<span class="pill warn">sem vínculo</span>'}</td><td>${esc(s.pdv)}</td><td class="num">${s.n}</td><td class="num">${s.sold}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}

function detectBlack(p,cb){const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=16;c.height=16;const x=c.getContext('2d');x.drawImage(img,0,0,16,16);const d=x.getImageData(0,0,16,16).data;let sum=0;for(let i=0;i<d.length;i+=4)sum+=d[i]*.299+d[i+1]*.587+d[i+2]*.114;const lum=sum/(d.length/4);if(lum<22)p.black=true;}catch(e){}if(cb)cb();};img.onerror=()=>{if(cb)cb()};img.src=UP[p.id].src;}
const FILE={};DATA.sampled.forEach(s=>s.photos.forEach(p=>{FILE[p.id]=(p.file||'').split('_')[0]+'.JPG'}));
const fileName=id=>UP[id]?UP[id].name:(FILE[id]||id);
function h32(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}return h}
const ING0=()=>({running:false,timer:null,queue:[],feed:[],cur:null,done:[],n:{arrived:0,dup:0,black:0,auto:0,flagged:0,unsure:0},total:0});
state.ing=ING0();
const ING_FLAGS=['Flamengo','Brasil',null,'Fluminense','Vasco','Argentina'];
function ingQueue(){
  const sess=DATA.sampled.filter(x=>x.key===state.imp.key).slice(0,4);const q=[];
  sess.forEach((x,i)=>{const ph=x.photos.filter(p=>hasImg(p.id)).slice(0,7);const flag=ING_FLAGS[i%ING_FLAGS.length];
    ph.forEach((p,j)=>q.push({id:p.id,kind:'photo',flag,conf:flag?((i===3&&j===2)?61:84+(h32(p.id)%14)):0}));
    if(i===1)ph.slice(0,3).forEach(p=>q.push({id:p.id,kind:'dup'}));
    q.push({kind:'gap',how:['pausa de 48 s e rostos novos','rostos novos sem pausa: o grupo seguinte já entrou no quadro','pausa de 3 min entre grupos','criança sozinha e depois com os pais: um rosto em comum, mesmo grupo; fechou na pausa seguinte'][i]});
  });
  return q;
}
function ingStart(queue){const g=state.ing;if(g.timer)clearInterval(g.timer);g.queue=queue||ingQueue();g.total=g.queue.length;g.running=true;g.timer=setInterval(ingTick,650);render();}
function ingPush(items){const g=state.ing;g.queue.push(...items);g.total+=items.length;if(!g.running){g.running=true;g.timer=setInterval(ingTick,650);}}
// agente do ponto: programa local que vigia o cartão e entrega as fotos (agente/eterna-agente.py)
state.agent={on:false,cursor:0,card:null,copied:0,dups:0,timer:null,url:((location.hostname==='127.0.0.1'||location.hostname==='localhost')&&location.port)?location.origin:'http://127.0.0.1:8765',tried:false,err:null};
async function agentPoll(){const a=state.agent;if(state.view!=='importar'&&!a.on)return;
  try{const st=await (await fetch(a.url+'/status',{cache:'no-store'})).json();if(!st.ok)throw new Error('x');const was=a.on;a.on=true;a.err=null;a.card=st.card;a.copied=st.copied;a.dups=st.dups;a.ftp=st.ftp||null;if(!was){toast('Agente do ponto conectado');render();}
    const ev=await (await fetch(a.url+'/events?since='+a.cursor,{cache:'no-store'})).json();if(ev.events.length){const items=[];ev.events.forEach(e=>{if(e.type==='photo'){const id='ag_'+e.id;UP[id]={src:a.url+e.thumb,name:e.name};items.push({id,kind:'photo',flag:null,conf:0,t:e.t,size:e.size,real:true,src:e.src||'cartao',who:e.card});}else if(e.type==='dup'){const id='ag_'+e.id;if(!UP[id])UP[id]={src:a.url+'/thumb/'+e.id,name:e.name};items.push({id,kind:'dup',real:true});}});a.cursor=ev.next;ingPush(items);state.ing.lastReal=Date.now();render();}
    else if(state.ing.cur&&state.ing.lastReal&&!state.ing.running&&Date.now()-state.ing.lastReal>45000){state.ing.n.auto++;ingClose('pausa de 45 s sem foto nova');state.ing.feed.unshift({k:'auto',t:'Grupo fechado pelo servidor',s:'pausa de 45 s sem foto nova no cartão'});render();}
    if(a.card!==(st.card||null)){a.card=st.card;render();}
  }catch(e){if(a.on){a.on=false;render();}a.err=String(e&&e.message||e);a.tried=true;}
}
setInterval(agentPoll,2500);
setTimeout(livePoll,800);setInterval(livePoll,60000);
function ingStop(){const g=state.ing;if(g.timer)clearInterval(g.timer);g.timer=null;g.running=false;}
function ingClose(how){const g=state.ing;const c=g.cur;g.cur=null;if(!c||!c.photos.length)return;
  const pt=DATA.points.find(p=>p.id===state.imp.point);const card='LP'+Math.random().toString(36).slice(2,9).toUpperCase();
  const top=Object.entries(c.flags).sort((a,b)=>b[1]-a[1])[0];const flag=top?top[0]:null;
  SIM.sessions[card]={key:state.imp.key,pdv:pt?pt.name:'',point:state.imp.point,time:hhmm(now()),date:'hoje',status:'fechada',selected:[],bg:null,cart:[],photos:c.photos.map(p=>({id:p.id,sold:0})),openedAt:c.start,closedAt:now().toISOString(),source:state.imp.mode,closedBy:how,flag};
  if(flag){if(!SIM.flagUse)SIM.flagUse={};SIM.flagUse[flag]=(SIM.flagUse[flag]||0)+1;}
  if(!SIM.invalid)SIM.invalid={};let bad=[];c.photos.forEach(p=>{const r=validatePhoto(p.id);if(r){SIM.invalid[p.id]=r;p.invalid=r;bad.push(r);}});g.n.invalid=(g.n.invalid||0)+bad.length;
  g.feed.unshift({k:bad.length?'warn':'ok',t:`Validação: ${c.photos.length-bad.length} válidas${bad.length?`, ${bad.length} não ${bad.length===1?'válida':'válidas'}`:''}`,s:bad.length?`IA barrou: ${[...new Set(bad)].join(', ')}. Ficam no acervo, fora da fila.`:'técnica e IA aprovaram todas'});
  g.done.unshift({card,n:c.photos.length-bad.length,how,flag,photos:c.photos});
  log(`Upload por ${srcName()}: sessão ${card} de ${P[state.imp.key].name}, ${c.photos.length} fotos, fechada por ${how}${flag?', bandeira '+flag:''}`);saveSim();
}
const srcName=()=>state.imp.mode==='cartao'?'cartão':state.imp.mode==='5g'?'5G':'Wi‑Fi';
function ingTick(){
  const g=state.ing;const it=g.queue.shift();
  if(!it){if(state.agent.on){ingStop();render();return;}ingClose('fim da leva');ingStop();render();return;}
  if(it.kind==='photo'){
    if(it.t&&g.cur&&g.cur.lastT&&it.t-g.cur.lastT>45){const gap=Math.round(it.t-g.cur.lastT);g.n.auto++;ingClose(`pausa de ${gap>120?Math.round(gap/60)+' min':gap+' s'} entre cliques`);g.feed.unshift({k:'auto',t:'Grupo fechado pelo servidor',s:`pausa de ${gap>120?Math.round(gap/60)+' min':gap+' s'} entre o último clique e este`});}
    if(!g.cur)g.cur={photos:[],flags:{},start:now().toISOString()};if(it.t)g.cur.lastT=it.t;
    g.cur.photos.push({id:it.id,sold:0,flag:it.flag,conf:it.conf});if(it.flag)g.cur.flags[it.flag]=(g.cur.flags[it.flag]||0)+1;
    g.n.arrived++;if(it.flag){g.n.flagged++;if(it.conf<70)g.n.unsure++;}
    const mb=(it.size?it.size/1e6:6.8+(h32(it.id)%22)/10).toFixed(1).replace('.',',');

function flagStats(f){if(!f[5]||!f[3])return {sessions:0,sold:0,revenue:0,conv:0};const base=FLAG_W[f[1]]!=null?FLAG_W[f[1]]:(h32(f[1])%7);const extra=(SIM.flagUse&&SIM.flagUse[f[1]])||0;const sessions=base+extra;const conv=.74+(h32(f[1]+'c')%17)/100;const sold=Math.round(sessions*conv);return {sessions,sold,revenue:sold*(118+(h32(f[1]+'r')%40)),conv};}

// ---------- Gestão: alertas ----------
function alerts(){
  const out=[];
  for(const k of humans){const s=stats[k];
    s.perDay.forEach(p=>{if(!p.off&&p.ppc>45)out.push({sev:'warn',t:`${s.name}: ${p.ppc.toFixed(0)} fotos por sessão em ${dlabel(p.date)}`,d:`${fmtN(p.photos)} fotos para ${p.cards} sessões. Normal é 16 a 25. Grupos fundidos por foto preta esquecida, ou disparo contínuo.`})});
    s.perDay.forEach(p=>{if(!p.off&&p.conv<.75&&p.cards>=15)out.push({sev:'warn',t:`${s.name}: conversão de ${Math.round(p.conv*100)}% em ${dlabel(p.date)}`,d:`${p.cardsSold} de ${p.cards} sessões viraram venda. A média da equipe é 83%.`})});
    if(s.index!=null&&s.index<85)out.push({sev:'bad',t:`${s.name}: índice ${s.index}, abaixo dos colegas em todos os dias`,d:`Dias: ${s.perDay.filter(p=>!p.off).map(p=>p.index).join(', ')}. ${s.psc.toFixed(1)} fotos vendidas por venda e R$ ${Math.round(s.rpc)} por sessão. O problema está na venda, não só no volume.`});
    const last=s.perDay.filter(p=>!p.off).slice(-2);if(last.length===2&&last.every(p=>p.index<95)&&s.index>=95)out.push({sev:'warn',t:`${s.name}: caiu nos dois últimos dias`,d:`Índice ${last.map(p=>p.index).join(' e ')} depois de uma semana na média ou acima.`});
  }
  Object.entries(unlinked).forEach(([kd,n])=>{const [k,d]=kd.split('|');const ses=DATA.sessions.filter(s=>s.key===k&&s.date===d&&s.card).length||1;const r=n/ses;if(r>=2)out.push({sev:r>=3?'bad':'warn',t:`${P[k].name}: ${n} fotos fora de sessão em ${dlabel(d)}, ${r.toFixed(1)} por grupo`,d:`Separação automática resolve; conferir no Fluxo.`})});
  if(SIM.stock['Caixa 1']<60)out.push({sev:'warn',t:`Caixa 1: rolo com ${SIM.stock['Caixa 1']} impressões`,d:'Trocar antes do pico da tarde.'});
  flagList().forEach(x=>{if(!x[5]||!x[3])return;const st=flagOf(x),fs=flagStats(x);if(st.state==='defeito'||st.state==='fora de uso')out.push({sev:'warn',t:`Bandeira ${x[1]}: ${st.state}${st.note?', '+st.note:''}`,d:`${x[3]===1?'Peça única. ':''}Repor antes do fim de semana.`});else if(x[3]===1&&fs.sessions>=100)out.push({sev:'warn',t:`Bandeira ${x[1]}: peça única com ${fs.sessions} sessões na semana`,d:'Em dia de jogo falta. Comprar a segunda unidade.'});});
  out.push({sev:'warn',t:'Escala: 25 turnos para 28 necessários',d:'Quatro pontos por sete dias com cinco pessoas em 5x2 deixa 3 turnos descobertos; com o vestiário, 10.'});
  const best=humans.map(k=>stats[k]).sort((a,b)=>b.index-a.index)[0];out.push({sev:'good',t:`${best.name} lidera a semana com índice ${best.index}`,d:`${fmtR(best.revenue)} em ${best.days} dias, ticket ${fmtR(best.ticket)}.`});
  const order={bad:0,warn:1,good:2};return out.sort((a,b)=>order[a.sev]-order[b.sev]);
}

// Código de acesso: quando MAIL_API aponta para um serviço de e-mail (POST /auth/codigo e /auth/verificar, contrato em
// servidor/email/README.md), o código sai por e-mail. Vazio: o código é gerado no navegador e aparece na caixa simulada.
const MAIL_API='';
async function mailApi(rota,corpo){if(!MAIL_API)return {status:0};try{const r=await fetch(MAIL_API+rota,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)});let j={};try{j=await r.json()}catch(e){}return {status:r.status,...j};}catch(e){return {status:0};}}
async function sendCode(){const e=normEmail(state.auth.email);if(!emailOk(e)){state.auth.err='Digite um e-mail válido.';render();return;}if(state.auth.busy)return;state.auth.busy=true;state.auth.err=null;render();
  const r=await mailApi('/auth/codigo',{email:e});state.auth.busy=false;
  if(r.status===429){state.auth.err='Aguarde um pouco antes de pedir outro código.';render();return;}
  if(r.status===400){state.auth.err='Digite um e-mail válido.';render();return;}
  const real=r.status===202;const code=real?null:String(Math.floor(100000+Math.random()*900000));
  state.auth.pending={email:e,code,real,at:now().toISOString(),exp:new Date(now().getTime()+10*60e3).toISOString()};state.auth.step='code';state.auth.code='';state.auth.err=null;render();const i=$('[data-act="login-code"]');if(i)i.focus();}
async function checkCode(){const p=state.auth.pending;const c=(state.auth.code||'').replace(/\D/g,'');if(!p){state.auth.step='email';render();return;}if(new Date(p.exp)<now()){state.auth.err='Código expirado. Peça outro.';state.auth.step='email';state.auth.pending=null;render();return;}
  if(p.real){if(state.auth.busy)return;state.auth.busy=true;const r=await mailApi('/auth/verificar',{email:p.email,codigo:c});state.auth.busy=false;
    if(r.status===200&&r.ok){try{localStorage.setItem('eterna.token',r.token)}catch(e){}login(p.email);return;}
    if(r.erro==='expirado'){state.auth.err='Código expirado. Peça outro.';state.auth.step='email';state.auth.pending=null;render();return;}
    state.auth.err=r.status===0?'Sem conexão. Tente de novo.':'Código incorreto.';render();return;}
  if(c!==p.code){state.auth.err='Código incorreto.';render();return;}login(p.email);}

  if(c.review){const r=draft();const v=r.photos[p.id]||0;bar+=`<button class="tb good" data-act="m-rate" data-v="1" aria-pressed="${v===1}">✓ Boa <small>(B)</small></button><button class="tb bad" data-act="m-rate" data-v="-1" aria-pressed="${v===-1}">✕ Ruim <small>(R)</small></button>`;}
  if(c.edit){const off=!!SIM.discarded[p.id];bar+=`<button class="tb ${MODAL.adjust?'on':''}" data-act="m-adjust">${c.quick?'Clarear / escurecer':'Ajustar'}</button>${c.quick?'':`<button class="tb ${off?'on':''}" data-act="m-discard">${off?'Recuperar foto':'Descartar foto'}</button>`}`;}
  let sl='';if(c.edit&&MODAL.adjust){const e=editOf(p.id);const S=(k,lab,min,max)=>`<label><span>${lab}: <b data-sv="${k}">${e[k]}</b>%</span><input type="range" min="${min}" max="${max}" value="${e[k]}" data-k="${k}"></label>`;
    sl=c.quick?`<div class="sliders">${S('b','Exposição',40,180)}${S('c','Contraste',50,160)}<div class="hint">Ajuste rápido no balcão: a foto escura ou estourada não precisa perder a venda. Vale para a impressão e para a galeria. <button class="tb" data-act="m-reset" style="padding:4px 10px;min-height:28px;margin-left:8px">Restaurar original</button></div></div>`
    :`<div class="sliders">${S('b','Exposição',40,180)}${S('c','Contraste',50,160)}${S('s','Saturação',0,200)}${S('z','Recorte (zoom)',100,250)}<div class="hint">Arraste a foto para enquadrar quando o recorte passar de 100%. Tudo salva na hora e vale para a fila, o caixa e a galeria. <button class="tb" data-act="m-reset" style="padding:4px 10px;min-height:28px;margin-left:8px">Restaurar original</button></div></div>`;}
  el.innerHTML=`<div class="bar">${bar}</div>${sl}`;}
function applyEditLive(){const p=curPhoto();if(!p)return;$('#modal-img').style.cssText=phStyle(p.id);}
function setEdit(k,v){const p=curPhoto();const e=editOf(p.id);e[k]=v;saveSim();applyEditLive();const sv=$(`[data-sv="${k}"]`);if(sv)sv.textContent=v;}
function toggleSel(card,id){const s=simOf(card);s.selected=s.selected||[];s.selected=s.selected.includes(id)?s.selected.filter(x=>x!==id):[...s.selected,id];saveSim();}

    case 'guest-buyall':{const s=simOf(state.guest.code);const sess=sessionObj(state.guest.code);s.selected=sess.photos.map(p=>p.id);s.cart=[...(s.cart||[]),{id:'mais'}];s.status='paga';s.payment=s.payment||'PIX online';s.paidAt=s.paidAt||now().toISOString();log(`Galeria: ${state.guest.code} levou todas em digital`);saveSim();toast('Pagamento aprovado. Todas liberadas em alta.');render();break;}
    case 'guest-download':toast('Na operação, baixa um ZIP com as fotos em 3.000 px.');break;
    case 'guest-share':toast('Link da galeria copiado para compartilhar.');break;
    case 'guest-notme':toast('Foto marcada para remoção. A equipe confirma em até 24 h (LGPD).');break;
    case 'guest-help':toast('Abre o WhatsApp do Tour com o código da sessão.');break;
    case 'price-reset':SIM.prices={};saveSim();toast('Preços de hoje restaurados');render();break;
    case 'stock-swap':SIM.stock['Caixa 1']=200;log('Rolo trocado no Caixa 1');saveSim();toast('Rolo do Caixa 1 zerado em 200');render();break;
  }
});
document.addEventListener('input',e=>{const a=e.target.dataset.act;if(a==='train-note'){state.train.note=e.target.value;return;}if(a==='login-email'){state.auth.email=e.target.value;return;}if(a==='login-code'){state.auth.code=e.target.value;if(e.target.value.replace(/\D/g,'').length===6)checkCode();return;}if(a==='user-field'){if(state.users.draft)state.users.draft[e.target.dataset.k]=e.target.value;return;}if(a==='di-text'){state.diario.text=e.target.value;return;}if(a==='rv-field'&&e.target.dataset.k==='base_url'){state.rvForm=state.rvForm||{};state.rvForm.base_url=e.target.value;return;}if(a==='fe-field'){if(state.flagEd)state.flagEd[e.target.dataset.k]=e.target.value;return;}if(a==='venue-field'){VENUE_CFG[e.target.dataset.k]=e.target.value||null;saveVenue();return;}if(a==='venue-color'){VENUE_CFG[e.target.dataset.k]=e.target.value;saveVenue();const b=e.target.parentElement.querySelector('b');if(b)b.textContent=e.target.value;return;}if(a==='aj-range'){if(can('set','u'))ajSet(state.ajustes.photo,e.target.dataset.k,+e.target.value);return;}if(a==='user-q'){state.users.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('[data-act="user-q"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}return;}if(a==='checkout-code'){state.checkout.code=e.target.value;const el=e.target;const pos=el.selectionStart;render();const n=$('[data-act="checkout-code"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}else if(a==='sales-q'){state.sales.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('[data-act="sales-q"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}else if(a==='note')draft().note=e.target.value;else if(a==='price'){SIM.prices[e.target.dataset.id]=+e.target.value||0;saveSim();}});
document.addEventListener('change',e=>{const a=e.target.dataset.act;if(a==='di-point'){state.diario.point=e.target.value;return;}if(a==='set-key'){state.set.key=e.target.value;render();return;}if(a==='func-point'){setFunc(e.target.dataset.k,{tipo:'campo',point:e.target.value});render();return;}if(a==='func-set'){const k=e.target.dataset.k,v=e.target.value;const f=funcOf(k);if(!v)setFunc(k,{tipo:'folga'});else if(v[0]==='c')setFunc(k,{tipo:'campo',point:v.slice(2)});else setFunc(k,{tipo:'volante',modo:v.slice(2),from:f.point||f.from||null});render();return;}if(a==='range-from'&&e.target.value){setRange(e.target.value,state.range.to<e.target.value?e.target.value:state.range.to);return;}if(a==='range-to'&&e.target.value){setRange(state.range.from>e.target.value?e.target.value:state.range.from,e.target.value);return;}if(a==='fe-sel'){if(state.flagEd)state.flagEd[e.target.dataset.k]=e.target.value;return;}if(a==='fe-active'){if(state.flagEd)state.flagEd.active=e.target.checked;return;}if(a==='fe-img'){const fl=e.target.files&&e.target.files[0];if(!fl||!state.flagEd)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const w=360,h=Math.round(360*im.height/im.width);c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);state.flagEd.imgData=c.toDataURL('image/jpeg',.82);render();};im.src=rd.result;};rd.readAsDataURL(fl);return;}if(a==='venue-powered'){VENUE_CFG.powered=e.target.checked;saveVenue();render();return;}if(a==='venue-logo'){const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>600*1024){toast('Logo acima de 600 KB: exporte menor');return;}const rd=new FileReader();rd.onload=()=>{VENUE_CFG.logo=rd.result;saveVenue();toast('Logo aplicada');render();};rd.readAsDataURL(f);return;}if(a==='user-key'){const dr=state.users.draft;if(dr){dr.key=e.target.value||null;}return;}if(a==='user-preset'){const dr=state.users.draft;if(dr){dr.preset=e.target.value;if(e.target.value!=='custom')dr.perms=presetPerms(e.target.value);render();}return;}if(a==='user-perm'){const dr=state.users.draft;if(!can('usuarios','u')){e.target.checked=!e.target.checked;return;}if(dr){const m=e.target.dataset.m,op=e.target.dataset.op;dr.perms[m]=dr.perms[m]||{...NONE};dr.perms[m][op]=e.target.checked;if(op!=='r'&&e.target.checked)dr.perms[m].r=true;if(op==='r'&&!e.target.checked){dr.perms[m]={...NONE};}dr.preset='custom';render();}return;}if(a==='set-point'){state.set.point=e.target.value;render();}else if(a==='imp-key'){state.imp.key=e.target.value;render();}else if(a==='repo-set'){if(!SIM.repo)SIM.repo=SIM0().repo;SIM.repo[e.target.dataset.k]=e.target.value;saveSim();render();}else if(a==='imp-point'){state.imp.point=e.target.value;render();}else if(a==='imp-files'){const files=[...e.target.files].filter(f=>f.type.startsWith('image/')).slice(0,80);files.sort((x,y)=>x.name.localeCompare(y.name));const ps=files.map(f=>{const id='up_'+Math.random().toString(36).slice(2,10);UP[id]={src:URL.createObjectURL(f),name:f.name};return {id};});let left=ps.length;const go=()=>{if(--left>0)return;ingStart(ps.map(p=>p.black?{id:p.id,kind:'skip'}:{id:p.id,kind:'photo',flag:null,conf:0}));};ps.forEach(p=>detectBlack(p,go));toast(`${files.length} fotos saindo da ${state.imp.mode==='cartao'?'câmera pelo cartão':'câmera pelo celular'}`);e.target.value='';}else if(a==='flag-state'||a==='flag-point'){if(!SIM.flags)SIM.flags={};const n=e.target.dataset.n;SIM.flags[n]=Object.assign({},SIM.flags[n]||{},a==='flag-state'?{state:e.target.value,note:''}:{point:e.target.value});log(`Bandeira ${n}: ${a==='flag-state'?'estado '+e.target.value:'movida'}`);saveSim();render();}else if(a==='train-import'){const f=e.target.files&&e.target.files[0];if(!f)return;f.text().then(txt=>{try{const j=JSON.parse(txt);const rows=Array.isArray(j)?j:(j.labels||[]);rows.forEach(r=>{if(r&&r.id)trainSave(r.id,r)});toast(`${rows.length} rótulos importados`);render();}catch(x){toast('Arquivo inválido')}});}else if(a==='checkout-seller'){const sim=simOf(state.checkout.session);sim.seller=e.target.value;saveSim();}else if(a==='checkout-selfie'){if(!e.target.files||!e.target.files.length)return;toast('Procurando pelo rosto...');setTimeout(()=>{const cands=demoSessions().filter(x=>x.status==='pronta'||x.status==='fechada');const pick=cands[Math.floor(Math.random()*cands.length)];if(pick){toast('Encontramos: '+pick.card);checkoutPick(pick.card);}},1200);}else if(a==='guest-selfie'||a==='guest-qr'){if(!e.target.files||!e.target.files.length)return;const paid=Object.entries(SIM.sessions).filter(([c,x])=>x.status==='paga').map(([c])=>c);toast(a==='guest-selfie'?'Procurando pelo rosto...':'Lendo o QR...');setTimeout(()=>{selfieStop();state.guest.code=paid[0]||DATA.sampled[0].card;toast('Encontramos a sua sessão');render();},1200);}});
document.addEventListener('submit',e=>{const f=e.target.dataset.form;if(!f)return;e.preventDefault();if(f==='login-email')sendCode();if(f==='login-code')checkCode();});
document.addEventListener('keydown',e=>{if(state.view==='treino'&&!$('#modal').hasAttribute('data-open')&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){const k=e.key.toLowerCase();if(k==='p'){trainVerdict('pode');e.preventDefault();return;}if(k==='n'){trainVerdict('nao');e.preventDefault();return;}if(k==='d'){trainVerdict('duvida');e.preventDefault();return;}if(k==='arrowright'){state.train.i=(state.train.i+1)%TRAIN.length;render();return;}if(k==='arrowleft'){state.train.i=(state.train.i-1+TRAIN.length)%TRAIN.length;render();return;}if(/^[1-9]$/.test(k)){const r=TRAIN_REASONS[+k-1];if(r){trainToggleReason(r[0]);e.preventDefault();}return;}if(k==='enter'){const p=TRAIN[state.train.i];if(state.train.labels[p.id]){trainNext();}return;}}if(e.key==='Escape'&&$('#modal').hasAttribute('data-open'))closeModal();if($('#modal').hasAttribute('data-open')&&MODAL.list.length>1&&e.target.tagName!=='INPUT'){if(e.key==='ArrowRight'){showModal(MODAL.i+1);e.preventDefault();}if(e.key==='ArrowLeft'){showModal(MODAL.i-1);e.preventDefault();}}
  if($('#modal').hasAttribute('data-open')&&MODAL.ctx.review&&e.target.tagName!=='INPUT'){const k=e.key.toLowerCase();if(k==='b'||k==='r'){const p=curPhoto();const r=draft();const v=k==='b'?1:-1;if(r.photos[p.id]===v)delete r.photos[p.id];else r.photos[p.id]=v;render();renderModalTools();}}if(e.key==='Enter'&&e.target.id==='kcode'){state.kiosk.code=e.target.value.trim().toUpperCase();state.kiosk.step='gallery';render();}if(e.key==='Enter'&&e.target.id==='gcode'){state.guest.code=e.target.value.trim().toUpperCase();render();}});
function closeModal(){$('#modal').removeAttribute('data-open');if(state.view==='ajustes'||state.view==='fila'||state.view==='caixa')render();}
$('#modal-close').addEventListener('click',closeModal);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#modal-prev').addEventListener('click',e=>{e.stopPropagation();showModal(MODAL.i-1)});
$('#modal-next').addEventListener('click',e=>{e.stopPropagation();showModal(MODAL.i+1)});
let swipeX=null;$('#modal').addEventListener('touchstart',e=>{const p=curPhoto();swipeX=(MODAL.adjust&&p&&editOf(p.id).z>100)?null:e.touches[0].clientX},{passive:true});$('#modal').addEventListener('touchend',e=>{if(swipeX==null||MODAL.list.length<2)return;const dx=e.changedTouches[0].clientX-swipeX;if(Math.abs(dx)>40)showModal(MODAL.i+(dx<0?1:-1));swipeX=null;});
$('#modal-tools').addEventListener('input',e=>{const k=e.target.dataset.k;if(k)setEdit(k,+e.target.value);});
(()=>{const im=$('#modal-img');let drag=null;im.addEventListener('pointerdown',e=>{if(!MODAL.adjust)return;const p=curPhoto();if(!p)return;const ed=editOf(p.id);if(ed.z<=100)return;drag={x0:e.clientX,y0:e.clientY,ex:ed.x,ey:ed.y,w:im.clientWidth,h:im.clientHeight};im.setPointerCapture(e.pointerId);e.preventDefault();});
  im.addEventListener('pointermove',e=>{if(!drag)return;const p=curPhoto();const ed=editOf(p.id);const z=ed.z/100;ed.x=Math.max(-30,Math.min(30,Math.round(drag.ex+(e.clientX-drag.x0)/drag.w*100/z)));ed.y=Math.max(-30,Math.min(30,Math.round(drag.ey+(e.clientY-drag.y0)/drag.h*100/z)));applyEditLive();});
  im.addEventListener('pointerup',()=>{if(drag){saveSim();drag=null;}});im.addEventListener('pointercancel',()=>{drag=null;});})();

function draft(){const s=DATA.sampled.find(x=>x.card===state.session);if(!state.reviews[s.card])state.reviews[s.card]={key:s.key,date:s.date,card:s.card,photos:{},score:0,tags:[],note:''};else if(Object.isFrozen(state.reviews[s.card]))state.reviews[s.card]=JSON.parse(JSON.stringify(state.reviews[s.card]));if(!state.reviews[s.card].photos)state.reviews[s.card].photos={};return state.reviews[s.card]}
async function save(){if(!state.db)return;const r=draft();const body={...r,updatedAt:new Date().toISOString()};try{await state.db.doc('reviews/'+r.card).set(body);state.reviews[r.card]=body;toast('Sessão salva');render();}catch(err){toast('Não salvou: '+(err&&err.code||'erro'));}}

// ---------- boot ----------
applyVenue();sessionLoad();if(!readHash()){state.view=state.user?(canView(state.view)&&state.view!=='entrar'?state.view:homeView()):'entrar';}
window.addEventListener('hashchange',()=>{if(readHash()){render();return;}const h=location.hash.replace(/^#/,'');if(!state.user){render();return;}if(!h){go(homeView());return;}if(VIEWFN[h.split('/')[0]])toast('Sem acesso a esta tela');render();});
const openCard=Object.keys(SIM.sessions).find(c=>SIM.sessions[c].status==='aberta');
if(openCard){state.set.open=openCard;state.set.point=SIM.sessions[openCard].point||state.set.point;startArrivals(openCard,SIM.sessions[openCard].key);}
render();
setInterval(()=>{if(state.view==='set'&&state.set.open){const t=$('#timer');const s=SIM.sessions[state.set.open];if(t&&s){const el=Math.max(0,Math.round((now()-new Date(s.openedAt))/1000));t.textContent=Math.floor(el/60)+':'+String(el%60).padStart(2,'0');}}},1000);
(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{const db=await claude.use('db');if(!db)return;state.db=db;
    db.collection('treino').onSnapshot(snap=>{snap.docs.forEach(d=>{if(d.exists){const x=d.data();if(x&&x.id)state.train.labels[x.id]=x;}});try{localStorage.setItem('eterna.treino.v1',JSON.stringify(state.train.labels))}catch(e){}render();},err=>{console.warn('db',err)});
    db.collection('usuarios').onSnapshot(snap=>{let ch=false;snap.docs.forEach(d=>{if(!d.exists)return;const x=d.data();if(!x||!x.email)return;if(x.deleted){if(USERS[x.email]){delete USERS[x.email];ch=true;}return;}USERS[x.email]=x;ch=true;});if(ch){try{localStorage.setItem('eterna.users.v1',JSON.stringify(USERS))}catch(e){}if(state.user&&!state.user.guest){const u=userFor(state.user.email);if(!u){logout();toast('Seu acesso foi removido');return;}state.user=u;}render();}},err=>{console.warn('db',err)});
    db.collection('diario').onSnapshot(snap=>{SIM.diario=SIM.diario||[];let ch=false;snap.docs.forEach(d=>{if(!d.exists)return;const x=d.data();if(!x||!x.id)return;const i=SIM.diario.findIndex(y=>y.id===x.id);if(i<0)SIM.diario.unshift(x);else SIM.diario[i]=x;ch=true;});if(ch){SIM.diario.sort((a,b)=>b.at.localeCompare(a.at));saveSim();render();}},err=>{console.warn('db',err)});
    db.doc('config/venue').onSnapshot(d=>{if(d&&d.exists){const x=d.data();if(x&&x.id&&VENUES[x.id]){VENUE_CFG=Object.assign(VENUE_CFG0(),x);try{localStorage.setItem('eterna.venue.v1',JSON.stringify(VENUE_CFG))}catch(e){}applyVenue();render();}}},err=>{console.warn('db',err)});
    db.collection('reviews').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});state.reviews=m;render();},err=>{console.warn('db',err)});
    render();
  }catch(e){console.warn('db',e)}
})();
window.ETERNA={get state(){return state},camStatus,camFound};
})();

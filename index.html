.ajed{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:14px;align-items:start}
@media (max-width:900px){.ajed{grid-template-columns:1fr}}
.ajpv::before{filter:var(--flt,none);transform:var(--tf,none);transform-origin:center}
.ajpv.off{opacity:.4}
.ajctl{gap:14px}
.ajrow input[type=range]{flex:1;min-width:0;accent-color:var(--fg)}
.ajrow .btn{min-width:44px;padding:0;font-size:20px}
.vword{font-family:var(--display);font-weight:600;letter-spacing:.02em;white-space:nowrap}
.vmark{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:.9;font-family:var(--display);color:inherit}
.vmark b{font-size:var(--h);font-weight:700;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.vmark small{font-size:calc(var(--h)*.36);font-weight:600;letter-spacing:.32em;text-transform:uppercase;opacity:.75;margin:0 0 .18em .08em}
.vmark small:last-child:not(:first-child){margin:.2em 0 0 .08em}
.vlogo{display:block;max-width:240px;object-fit:contain}
.vbrand{display:flex;align-items:center;text-align:left;padding:2px 0 6px}
.login-mark{display:flex;justify-content:center}
.login-mark .vmark{align-items:center}
.powered{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.powered b{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10px}
.powered svg{flex:none;opacity:.8}
.rail .venue .powered b{font-family:var(--body);font-size:10px;font-weight:600;color:inherit}
/* tema Maracanã: menu azul-marinho, conteúdo claro, amarelo como destaque, títulos condensados */
:root[data-venue="maracana"]{--bg:#f7f7f5;--surface:#ffffff;--surface2:#eef2f8;--fg:#0C2340;--muted:#5b6370;--line:#dfdfdb;--good:#005500;--good-bg:#e2efe0;--warn:#8a6200;--warn-bg:#fff3d1;--bar:#134078;--bar2:#9fb5d6;--rail:#134078;--rail-ink:#ffffff;--rail-muted:#b3c6e3;--nav-grp:rgba(255,255,255,.92)}
:root[data-venue="maracana"] .rail{background:var(--rail)}
:root[data-venue="maracana"] .rail::before{content:'';position:absolute;left:0;right:0;top:0;height:200px;background:radial-gradient(circle,rgba(48,127,226,.7) 1.4px,transparent 1.9px) 0 0/9px 9px;-webkit-mask-image:linear-gradient(205deg,#000 0,transparent 75%);mask-image:linear-gradient(205deg,#000 0,transparent 75%);pointer-events:none}
:root[data-venue="maracana"] .rail > *{position:relative}
:root[data-venue="maracana"] .eyebrow,:root[data-venue="maracana"] .nav .grp{letter-spacing:.2em}
:root[data-venue="maracana"] .rail{color:var(--rail-ink);border-right:0;position:sticky}
:root[data-venue="maracana"] .rail .nav small,:root[data-venue="maracana"] .rail .nav .grp,:root[data-venue="maracana"] .rail .venue,:root[data-venue="maracana"] .rail .powered{color:var(--rail-muted)}
:root[data-venue="maracana"] .rail .nav button.grp{color:var(--nav-grp);letter-spacing:.14em} /* v81 */
:root[data-venue="maracana"] .rail .nav button:hover{background:rgba(255,255,255,.06)}
:root[data-venue="maracana"] .rail .nav button[aria-current="page"]{background:rgba(255,255,255,.1);box-shadow:inset 3px 0 0 var(--venue2);font-weight:600}
:root[data-venue="maracana"] .rail .chip{background:transparent;color:var(--rail-ink);border-color:rgba(255,255,255,.3)}
:root[data-venue="maracana"] .rail .note{color:var(--rail-muted)}
:root[data-venue="maracana"] .rail .pill{color:var(--rail-ink);border-color:rgba(255,255,255,.3)}
:root[data-venue="maracana"] h1{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:44px}
:root[data-venue="maracana"] h2{font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:22px}
:root[data-venue="maracana"] h3{font-weight:700;text-transform:uppercase;letter-spacing:.1em}
:root[data-venue="maracana"] .tile .v{font-weight:800;letter-spacing:.04em}
:root[data-venue="maracana"] .role .t{text-transform:uppercase;font-weight:700;font-size:26px;letter-spacing:.08em}
:root[data-venue="maracana"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-venue="maracana"] .pill.good{background:var(--good-bg)}
:root[data-venue="maracana"] .chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-venue="maracana"] .scard .code,:root[data-venue="maracana"] input.code{font-weight:700}
:root[data-venue="maracana"] .app::before{height:4px;background:linear-gradient(90deg,var(--accent) 0 60%,var(--venue2) 60% 80%,var(--good) 80%)}
:root[data-venue="maracana"] body[data-bare]{background:var(--bg)}
:root[data-venue="maracana"] body[data-bare]::before{content:'';position:absolute;left:0;right:0;top:0;height:270px;z-index:-1;background:linear-gradient(195deg,transparent 0,var(--rail) 62%),radial-gradient(circle,rgba(48,127,226,.65) 1.5px,transparent 2px) 0 0/10px 10px,var(--rail)}
:root[data-venue="maracana"] body[data-bare] .enter.login .login-mark,:root[data-venue="maracana"] body[data-bare] .enter.login > .note{color:#fff}
:root[data-venue="maracana"] body[data-bare] .enter.login > .note{color:var(--rail-muted)}
:root[data-venue="maracana"] .kiosk .screen{border-top:6px solid var(--accent)}
:root[data-venue="maracana"] .btn.primary:hover{background:#0C2340;border-color:#0C2340}
:root[data-venue="maracana"] .logobox{border-style:solid}
@media (max-width:900px){:root[data-venue="maracana"] .rail{border-bottom:0}}
.cobrand{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.cobrand .by{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cobrand .x{color:var(--muted)}
.logobox{min-width:120px;min-height:48px;display:flex;align-items:center;padding:6px 10px;border:1px dashed var(--line);border-radius:6px}
.sws{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:3px;font-size:12px}
.sw span{display:block;width:72px;height:40px;border-radius:5px;border:1px solid var(--line)}
.sw b{font-variant-numeric:tabular-nums}
.sw small{color:var(--muted)}
.pv{border:1px solid var(--line);border-radius:8px;padding:18px;background:var(--bg);display:flex;flex-direction:column;gap:10px;align-items:stretch;margin-top:8px}
.pv-input{border:1px solid var(--line);border-radius:5px;padding:10px;color:var(--muted);background:var(--surface);font-size:13px;margin-top:8px}
.pv-btn{background:var(--fg);color:var(--bg);border-radius:5px;padding:10px;text-align:center;font-size:13px}
.pv-h{font-family:var(--display);font-size:24px;text-align:center}
.pv-face{height:90px;border-radius:8px;background:radial-gradient(ellipse at center,#2a2622 0%,#141311 70%);display:flex;align-items:center;justify-content:center}
.pv-face span{width:48px;height:62px;border:2px solid var(--accent);border-radius:50%}
.pv-by{display:flex;justify-content:center}
.app::before{content:'';position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--venue2,var(--accent)));z-index:9}
:root[data-venue="lolla"]{--bg:#0b0a12;--surface:#15131f;--surface2:#1e1b2b;--fg:#f6f3ff;--muted:#a79fbf;--line:#2b2740;--bar:#f6f3ff;--bar2:#3a3552;--good:#8ef0a6;--warn:#ffd166;--bad:#ff7a7a;--good-bg:#17301f;--warn-bg:#332a10;--bad-bg:#3a1a1a;color-scheme:dark}
:root[data-venue="lolla"] .brand span,:root[data-venue="lolla"] h1,:root[data-venue="lolla"] h2{letter-spacing:.01em}
:root[data-venue="lolla"] .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:root[data-venue="lolla"] .pill.good{color:#0b0a12;background:var(--venue2)}
:root[data-venue="lolla"] .nav button[aria-current="page"]{box-shadow:inset 3px 0 0 var(--accent)}
.revbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}.revbar label{display:flex;flex-direction:column;gap:4px}.revbar select{width:auto;min-width:160px;min-height:42px}.revbar input[type=date]{border:1px solid var(--line);border-radius:5px;padding:8px 10px;background:var(--surface);color:var(--fg);font:inherit;font-size:16px;min-height:42px;cursor:pointer}
/* ---------- Painel (v80): tokens de qualquer venue; o Maracanã usa o manual Viva Maracanã ---------- */
:root{--pn-focus:var(--accent);--pn-focus2:var(--venue2,var(--accent));--pn-rest:#d9d9d6;--pn-rest2:#8e9193;--pn-hl:var(--venue2,#e0a800);--pn-up:var(--good);--pn-up-bg:var(--good-bg);--pn-down:var(--fg);--pn-down-bg:var(--surface2)}
:root[data-venue="maracana"]{--pn-focus:#134078;--pn-focus2:#307FE2;--pn-rest:#D9D9D6;--pn-rest2:#8E9193;--pn-hl:#FFB800;--pn-up:#005500;--pn-up-bg:#E2EFE0;--pn-down:#25282A;--pn-down-bg:#ECECEA}
.pn{display:flex;flex-direction:column;gap:16px;min-width:0;max-width:1150px;width:100%}
.pn .num,.pn table{font-variant-numeric:tabular-nums}
.pn-head{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:16px 20px;flex-wrap:wrap}
.pn-head::after{content:'';position:absolute;right:-28px;top:-26px;width:520px;max-width:60%;height:190px;z-index:0;pointer-events:none;background:radial-gradient(circle,rgba(48,127,226,.2) 1.6px,transparent 2.1px) 0 0/11px 11px;-webkit-mask-image:radial-gradient(ellipse 90% 110% at 100% 20%,#000 0,rgba(0,0,0,.5) 40%,transparent 72%);mask-image:radial-gradient(ellipse 90% 110% at 100% 20%,#000 0,rgba(0,0,0,.5) 40%,transparent 72%)}
.pn-head>*{position:relative;z-index:1}
.pn-head .eyebrow{margin:0;letter-spacing:.2em}
.pn-head h1{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:52px;line-height:.95;margin:8px 0 0}
.pn-btn{border-color:var(--pn-focus);color:var(--pn-focus);font-weight:600;min-height:40px}
.pn-notas{margin:-6px 0 0;font-size:12.5px;color:var(--muted)}
.pn-none{color:var(--muted)}
/* filtros (rangeBar de Painel, Fotógrafos e Vendas) */
.rangebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-top:14px;border-top:1px solid var(--line)}
.rangebar .chips{gap:5px}
.rangebar .chip{min-height:36px;padding:0 10px;font-weight:500}
.rangebar .dates{display:flex;align-items:center;gap:8px}
.rangebar .arrow{color:var(--muted)}
.filtros-end{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.datef{position:relative;display:inline-flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap;cursor:pointer;color:var(--fg)}
.datef svg{color:var(--muted);flex:none}
.datef:focus-within{outline:2px solid var(--pn-focus2);outline-offset:2px}
.datef>input.date-native{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;min-height:0;font-size:16px}
.datef>input.date-native::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.pn-sel{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 2px 0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13.5px}
.pn-sel>span{color:var(--muted)}
.pn-sel select{width:auto;border:0;background:transparent;font-weight:600;min-height:34px;padding:0 6px;max-width:88px;color:var(--fg);text-overflow:ellipsis}
.pn-sel select:disabled{color:var(--muted);cursor:not-allowed}
.pn-seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:3px;gap:2px}
.pn-seg button{min-height:30px;padding:0 11px;border-radius:4px;font-size:13px;font-weight:500;color:var(--muted)}
.pn-seg button[aria-pressed="true"]{background:var(--surface2);color:var(--pn-focus);font-weight:600;box-shadow:inset 0 0 0 1px rgba(19,64,120,.25)}
/* cartões */
.pn-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pn-kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px 16px;display:flex;flex-direction:column;min-width:0}
.pn-kpi-top{display:flex;align-items:center;gap:10px;min-width:0}
.pn-ico{width:36px;height:36px;border-radius:50%;background:var(--surface2);color:var(--pn-focus);display:grid;place-items:center;flex:none}
.pn-kpi-l{font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);min-width:0}
.pn-kpi-v{margin-top:14px;min-width:0}
.pn-big{display:block;font-family:var(--display);font-weight:800;font-size:clamp(32px,3.2vw,48px);line-height:1.05;letter-spacing:.05em;white-space:nowrap;font-variant-numeric:tabular-nums}
.pn .cur{font-size:.55em;letter-spacing:.04em;margin-right:.22em;font-weight:700}
.pn-kpi-sub{margin-top:6px;color:var(--muted);font-size:13px}
.pn-kpi-sub b{color:var(--fg);font-weight:600}
.pn-kpi-viz{margin-top:auto;padding-top:16px;min-height:50px;display:flex;flex-direction:column;justify-content:flex-end}
.pn-spark{display:flex;align-items:flex-end;gap:3px;height:30px}
.pn-spark i{flex:1;background:var(--pn-rest);border-radius:1.5px 1.5px 0 0;min-height:3px}
.pn-spark i.hi{background:var(--pn-focus)}
.pn-thin{height:4px;border-radius:2px;background:var(--pn-rest);overflow:hidden}
.pn-thin i{display:block;height:100%;background:var(--pn-focus);border-radius:2px}
.pn-thin-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.pn-thin-l b{color:var(--fg);font-weight:600}
.pn-kpi-foot{min-height:30px;margin-top:12px;padding-top:10px;border-top:1px solid #efefec;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.pn-kpi-foot:empty{border-top-color:transparent}
.pn-delta{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-weight:600;font-size:12px;white-space:nowrap}
.pn-delta.up{color:var(--pn-up);background:var(--pn-up-bg)}
.pn-delta.down{color:var(--pn-down);background:var(--pn-down-bg)}
.pn-delta.flat{color:var(--muted);background:var(--pn-down-bg)}
/* painéis */
.pn-panel{padding:22px 24px;gap:0}
.pn-panel h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:20px;line-height:1.05;margin:0}
.pn-take{margin:6px 0 0;font-family:var(--body);font-size:16px;font-weight:600;line-height:1.35;text-wrap:balance;max-width:44ch}
.pn-ph{display:flex;justify-content:space-between;gap:12px 16px;align-items:flex-start}
.pn-foot{margin:12px 0 0;font-size:12.5px;color:var(--muted)}
/* receita por dia */
.pn-days{margin-top:20px}
.pn-dbars{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px;align-items:end;height:190px;border-bottom:1px solid var(--line);padding:0 4px}
.pn-days.many .pn-dbars,.pn-days.many .pn-dlabels{gap:4px}
.pn-day{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;outline-offset:2px}
.pn-day i{display:block;width:100%;max-width:64px;background:var(--pn-rest);border-radius:3px 3px 0 0}
.pn-day.best i{background:var(--pn-focus)}
.pn-day .val{font-size:13px;font-weight:600;white-space:nowrap;margin-bottom:6px;font-variant-numeric:tabular-nums}
.pn-day.best .val{color:var(--pn-focus)}
.pn-dlabels{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px;padding:8px 4px 0;text-align:center;font-size:12px;color:var(--muted);line-height:1.3}
.pn-dlabels>span{min-width:0;overflow:hidden}
.pn-dlabels b{display:block;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.pn-dlabels .best b{color:var(--pn-focus);font-weight:700}
.pn-dlabels .hid{visibility:hidden}
.pn-days.many .wd{display:none}
.pn-days.many .pn-day .val{font-size:11px}
.pn-days.many .pn-day .val .rs{display:none}
/* composições */
.pn-comp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.pn-comp .pn-panel{display:flex;flex-direction:column}
@media (min-width:701px){.pn-comp .pn-take{min-height:2.7em}}
.pn-donut-row{display:flex;align-items:center;gap:22px;margin-top:20px}
.pn-donut{position:relative;flex:none}
.pn-donut svg{display:block}
.pn-donut .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:22px}
.pn-donut .c b{font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:.05em;line-height:1}
.pn-donut .c span{font-size:11.5px;color:var(--muted);margin-top:3px}
.pn-leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;min-width:0;flex:1}
.pn-leg li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;column-gap:8px;align-items:baseline;font-size:13.5px}
.pn-leg .sw{width:10px;height:10px;border-radius:2px;transform:translateY(1px)}
.pn-leg .nm small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pn-leg .pc{font-weight:600;font-variant-numeric:tabular-nums}
.pn-stack{margin-top:auto;padding-top:22px}
.pn-stack-l{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.pn-stack-l b{color:var(--fg);font-weight:600}
.pn-stackbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.pn-stackbar i{display:block;height:100%;min-width:3px}
.pn-funnel{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.pn-fstep .fl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;margin-bottom:6px}
.pn-fstep .fl b{font-variant-numeric:tabular-nums;font-weight:600}
.pn-fstep .fl small{color:var(--muted);font-size:12px;margin-left:6px}
.pn-ftrack{position:relative;height:22px;display:block}
.pn-ftrack .ghost{position:absolute;left:0;top:0;bottom:0;border:1px dashed #c4c5c2;border-left:0;border-radius:0 3px 3px 0}
.pn-ftrack .fill{position:absolute;left:0;top:0;bottom:0;background:var(--pn-rest);border-radius:0 3px 3px 0}
.pn-fstep.hi .fill{background:var(--pn-focus)}
.pn-floss{font-size:12px;color:var(--muted);padding:4px 0 6px 2px}
.pn-floss.big-loss{color:var(--pn-down);font-weight:600}
.pn-fnote{font-size:12px;padding:4px 0}
/* ranking e pagamentos */
.pn-bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.pn-rank{list-style:none;margin:18px 0 0;padding:0}
.pn-rank li{display:grid;grid-template-columns:34px minmax(0,1fr) 96px;column-gap:12px;row-gap:7px;align-items:baseline;padding:11px 0;border-top:1px solid #efefec}
.pn-rank li:first-child{border-top:0}
.pn-rank .pos{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;color:var(--muted)}
.pn-rank .nm{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.pn-rank .nm small{display:block;width:100%;margin-top:2px;font-weight:400;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.pn-rank .rv{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.pn-rank .sh{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1;align-self:center}
.pn-rank .bar{grid-column:2/3;align-self:center;height:6px;border-radius:3px;background:#f0f0ee;overflow:hidden;display:block}
.pn-rank .bar i{display:block;height:100%;background:var(--pn-rest2);border-radius:3px}
.pn-rank li.top .pos{color:var(--fg)}
.pn-rank li.top .bar i{background:var(--pn-hl)}

function sparkIdx(perDay){
  const W=200,H=54,n=perDay.length,bw=W/n;const vals=perDay.map(p=>p.off?null:p.index);const max=Math.max(140,...vals.filter(v=>v!=null));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:100%" role="img" aria-label="índice por dia">`;
  const y100=H-10-(H-14)*100/max;s+=`<line x1="0" x2="${W}" y1="${y100}" y2="${y100}" stroke="var(--line)" stroke-dasharray="3 3"/>`;
  vals.forEach((v,i)=>{const x=i*bw+bw*.2;if(v==null){s+=`<rect x="${x}" y="${H-12}" width="${bw*.6}" height="2" fill="var(--line)"/>`;return}const h=(H-14)*v/max;s+=`<rect x="${x}" y="${H-10-h}" width="${bw*.6}" height="${h}" rx="2" fill="${v>=100?'var(--bar)':'var(--bar2)'}"><title>${dlabel(perDay[i].date)}: ${v}</title></rect>`});
  return s+'</svg>';
}

// ---------- v79: dinheiro do Checkout aguardando caixa (SIM.caixaDin; só a equipe confirma, no Caixa) ----------
const CAIXA_ALERTA_MIN=15,DIN_DIAS=30,DIN_MAX=1000;
const DIN_ROT={confirmada:'confirmada',cancelada:'cancelada',nao_paga:'encerrada como não paga',substituida:'substituída'};
const STATUS_LBL={aguardando:'aguardando caixa',nao_paga:'não paga'};const statusLabel=st=>STATUS_LBL[st]||st;
const isoDia=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const novoSaleNo=()=>'E'+String(Object.values(SIM.sessions).filter(x=>x.saleNo).length+1).padStart(3,'0');
// impressas de uma venda (ajudante único, v79): o pacote imprime no máximo n fotos (as escolhidas) e cada adicional imprime 1; sem n, o pacote inteiro
function printsVenda(cart,n){let t=0;(cart||[]).forEach(c=>{const p=DATA.catalog.find(x=>x.id===c.id);if(!p)return;t+=p.kind==='pacote'&&n>0?Math.min(n,p.prints||0):(p.prints||0);});return t;}
// impressões de uma venda: as gravadas na venda ou, sem isso (vendas antigas), as calculadas pelo carrinho
function simPrints(sim){if(sim&&sim.prints!=null)return sim.prints;return printsVenda(sim&&sim.cart,((sim&&sim.selected)||[]).length||null);}
const recebidoPor=sim=>sim&&sim.caixaPor?`\nRecebido por ${esc(sim.caixaPor)}${sim.caixaEm?' às '+hhmm(new Date(sim.caixaEm)):''}`:'';
const dinAbertas=()=>(SIM.caixaDin||[]).filter(r=>r.estado==='aguardando');
const dinMin=r=>Math.max(0,Math.floor((now()-new Date(r.criada))/60000));
const dinAtrasada=()=>dinAbertas().some(r=>dinMin(r)>CAIXA_ALERTA_MIN);
function dinAbertaDe(card){const s=SIM.sessions[card];if(!s||!s.din)return null;return (SIM.caixaDin||[]).find(r=>r.id===s.din&&r.estado==='aguardando')||null;}
// fecha uma pendência (cancelada, nao_paga, substituida); a sessão que ainda estava aguardando volta para pronta
function dinFechar(id,estado,motivo,u){const r=(SIM.caixaDin||[]).find(x=>x.id===id);if(!r||r.estado!=='aguardando')return null;
  r.estado=estado;r.motivo=motivo||null;r.fechada=now().toISOString();r.por=u?u.email:'sistema';r.porNome=u?u.name:null;
  const s=SIM.sessions[r.card];if(s&&s.din===id){delete s.din;if(s.status==='aguardando')s.status='pronta';}return r;}
// virada do dia (00:00 local): pendência de ontem vira não paga; fechadas com mais de 30 dias saem; no máximo 1000 fechadas
function dinVirada(){const L=SIM.caixaDin;if(!Array.isArray(L)){SIM.caixaDin=[];return false;}if(!L.length)return false;const hoje=todayISO();let ch=false;
  L.filter(r=>r.estado==='aguardando'&&isoDia(r.criada)<hoje).forEach(r=>{dinFechar(r.id,'nao_paga','fim_do_dia',null);SIM.log.unshift({t:`Dinheiro não pago até o fim do dia: ${r.card} ${fmtR(r.total)} (código ${r.codigo})`,at:now().toISOString()});ch=true;});
  const lim=now().getTime()-DIN_DIAS*864e5;const fe=new Set(L.filter(r=>r.estado!=='aguardando'&&Date.parse(r.fechada||r.criada)>=lim).slice(0,DIN_MAX));
  const nv=L.filter(r=>r.estado==='aguardando'||fe.has(r));if(nv.length!==L.length){SIM.caixaDin=nv;ch=true;}
  if(ch){SIM.log=SIM.log.slice(0,80);saveSim();}return ch;}
// travas comuns de Confirmar e Cancelar: só no Caixa da equipe, com venda.c, lendo o SIM mais novo; pendência já fechada não muda (idempotência)

function refErro(v){const t=refLimpa(v);if(!t)return null;if(/^\d{13,19}$/.test(t))return 'Isso parece número de cartão. Digite só o NSU ou a autorização do comprovante (4 a 12 números).';if(!/^\d{4,12}$/.test(t))return 'NSU ou autorização: só números, de 4 a 12.';return null;}
// confirma uma pendência (cartão, PIX ou dinheiro). Sem baixa de estoque (vai para a impressão, parte F). Galeria publicada aqui só em local/off.
function pendConfirmar(id,o){o=o||{};const r=dinPegar(id);if(!r)return false;const meio=meioDe(r);

  s.vendaId=r.id;s.vendedor=r.vendedor||null;s.posto=r.posto||postoNome();s.pag={prov,ref,em:at,porNome:u.name};impIniciar(s);
  if((r.aiSel||[]).length){const ai=aiOf(r.card);r.aiSel.forEach(k=>{const [ph,bg]=String(k).split('|');if(!ai.bought.some(b=>b.ph===ph&&b.bg===bg))ai.bought.push({ph,bg,paidAt:at,where:'loja'});});}

  toast(meio==='dinheiro'?`Recebido ${fmtR(r.total)}.${imp}`:`Pagamento confirmado.${imp}`);render();return true;}

function postoDisp(){try{const d=JSON.parse(localStorage.getItem('eterna.posto.v1')||'null');return d&&typeof d==='object'&&d.id?d:null;}catch(e){return null;}}
state.posto={disp:null};
// nome do estoque e do cabeçalho: "Posto N" num posto pareado; "Caixa 1" no computador do ponto e sem agente (compatível com o estoque de antes)
function postoNome(){const d=pontoModo()==='posto'?postoDisp():null;return d&&d.nome?String(d.nome).slice(0,30):'Caixa 1';}
const postoTitulo=()=>pontoModo()==='posto'?postoNome():'Computador do ponto';
// quem abriu o Checkout neste notebook (gravado por lojaJanela); vai para a venda como vendedor declarado (D17)
function postoVendedor(){try{const v=JSON.parse(localStorage.getItem('eterna.posto.vendedor')||'null');if(v&&typeof v.email==='string'&&typeof v.nome==='string')return {nome:v.nome.replace(/[<>]/g,'').slice(0,60),email:v.email.slice(0,120)};}catch(e){}return null;}
const ROLO_CAP=700,ROLO_ALERTA=40,IMP_ALERTA_MIN=10;

// ---------- v83 (parte G, só o local): identificadores e fila de eventos ----------
// A fila fica em chaves próprias, fora do SIM (achado 8: saveSim de uma janela não apaga o que a outra enfileirou).
// eterna.ponto.fila.v1 = [{idem,venda,seq,tipo,em,por:{nome},dados}] · eterna.ponto.seqv.v1 = {venda: último seq} · eterna.ponto.seq.v1 = {dia,n} (saleNo do dia)
// tipos: criar, pagar, cancelar, impressao, rolo (rolo usa o id do aparelho como "venda"). Até existir o envio, a fila guarda no máximo 7 dias ou 2000 eventos; os descartes ficam registrados em eterna.ponto.descartes.v1.
// Etapa 2: pontoFlush() envia em ordem para POST /ponto/eventos (até 50 por vez; ok/ja saem, conflito/recusado vão para eterna.ponto.conflitos.v1).
const PV_FILA='eterna.ponto.fila.v1',PV_SEQV='eterna.ponto.seqv.v1',PV_SEQ='eterna.ponto.seq.v1';
const pvDispId=()=>{const d=pontoModo()==='posto'?postoDisp():null;return d&&d.id?d.id:'L00';};
function pvId(){const r=[...galRand(4)].map(b=>(b%36).toString(36)).join('');return pvDispId()+'-'+Date.now().toString(36)+r;}
// número do dia gerado dentro do mesmo navigator.locks da fila: as duas janelas do notebook nunca tiram o mesmo número. Devolve uma Promise.
function pvSaleNo(){return new Promise(res=>{let ok=false;const g=()=>{if(ok)return;ok=true;res(pvSaleNoGera());};
  try{if(navigator.locks&&typeof navigator.locks.request==='function'){navigator.locks.request('eterna-ponto-fila',g).catch(g);return;}}catch(e){}g();});}
function pvSaleNoGera(){const d=pontoModo()==='posto'?postoDisp():null;const pre=d&&d.num?'P'+d.num:'L0';const hoje=todayISO();let o=null;try{o=JSON.parse(localStorage.getItem(PV_SEQ)||'null');}catch(e){}
  if(!o||o.dia!==hoje)o={dia:hoje,n:0};o.n++;try{localStorage.setItem(PV_SEQ,JSON.stringify(o));}catch(e){}return pre+'-'+String(o.n).padStart(3,'0');}
function pvFila(){try{const l=JSON.parse(localStorage.getItem(PV_FILA)||'[]');return Array.isArray(l)?l:[];}catch(e){return [];}}
// R2: até existir o envio (etapa 2), a fila guarda no máximo 7 dias e 2000 eventos; o que sai fica registrado em eterna.ponto.descartes.v1.
// navigator.locks serializa a gravação entre as duas janelas do notebook (Checkout e admin); sem a API, grava direto.
const PV_DESC='eterna.ponto.descartes.v1',PV_MAX=2000,PV_DIAS=7;
function pvPoda(l){const lim=Date.now()-PV_DIAS*864e5;let fora=l.filter(e=>Date.parse(e.em)<lim);let fica=l.filter(e=>!(Date.parse(e.em)<lim));if(fica.length>PV_MAX){fora=fora.concat(fica.slice(0,fica.length-PV_MAX));fica=fica.slice(fica.length-PV_MAX);}
  if(fora.length){let d=[];try{d=JSON.parse(localStorage.getItem(PV_DESC)||'[]');if(!Array.isArray(d))d=[];}catch(e){d=[];}d.unshift({em:now().toISOString(),n:fora.length,de:fora[0].em,ate:fora[fora.length-1].em,motivo:'limite_sem_envio'});try{localStorage.setItem(PV_DESC,JSON.stringify(d.slice(0,50)));}catch(e){}console.warn('Eterna: '+fora.length+' eventos antigos saíram da fila local (sem envio ao agente nesta versão)');}
  return fica;}
function pvEvento(tipo,venda,dados){if(!venda)return null;const u=state.user;const em=now().toISOString();const por={nome:u?String(u.name||'').replace(/[<>]/g,'').slice(0,60):null};
  const grava=()=>{let sq={};try{sq=JSON.parse(localStorage.getItem(PV_SEQV)||'{}')||{};}catch(e){sq={};}
    const seq=(+sq[venda]||0)+1;sq[venda]=seq;const ks=Object.keys(sq);if(ks.length>3000)ks.slice(0,ks.length-3000).forEach(k=>delete sq[k]);
    const ev={idem:venda+':'+seq,venda,seq,tipo,em,por,dados:dados||{}};const l=pvPoda(pvFila().concat([ev]));
    try{localStorage.setItem(PV_FILA,JSON.stringify(l));localStorage.setItem(PV_SEQV,JSON.stringify(sq));}catch(e){state.simCheio=Date.now();}return ev;};
  try{if(navigator.locks&&typeof navigator.locks.request==='function'){navigator.locks.request('eterna-ponto-fila',grava).catch(e=>console.warn('fila local',e));return {venda,tipo,em};}}catch(e){}
  return grava();}
// dados do evento "criar" (contrato do plano v83). Sem e-mail do vendedor: só o nome declarado.
function pvDados(r){const ed={};(r.selected||[]).forEach(id=>{const e=SIM.edits&&SIM.edits[id];if(e)ed[id]={b:e.b,c:e.c,s:e.s,t:e.t,z:e.z,x:e.x,y:e.y};});
  return {saleNo:r.saleNo,card:r.card,meio:r.meio,prov:r.prov,total:r.total,cart:(r.cart||[]).map(x=>({id:x.id,v:itemV(x)})),prints:r.prints||0,nPh:r.nPh||0,nAI:r.nAI||0,
    selected:(r.selected||[]).slice(),aiSel:(r.aiSel||[]).slice(),fav:(r.fav||[]).slice(),ed,galeria:r.token?{token:r.token,codigo:r.codigo}:null,vendedor:{nome:(r.vendedor&&r.vendedor.nome)||null},lang:lang()};}

// ---------- v83 (parte F): impressão 10×15 pela DNP DS-RX1HS de cada notebook (Chrome; página PR 4×6 = 102×152 mm sem margem; rolo de ~700) ----------
// Foto com fundo de IA imprime (Eduardo, 29/10; a D8 do plano caiu): a montagem é refeita com o fundo de 5000 px (fileHi).
// Ordem: favoritas, depois as do campo, depois as de IA, até s.prints. semFoto = impressões do pacote sem foto nenhuma para imprimir.
function impFotos(s){const ph=(s.selected||[]).map(id=>({k:id,t:'ph',id}));const ai=(s.aiSel||[]).map(x=>{const [id,bg]=String(x).split('|');return {k:'ai:'+x,t:'ai',id,bg};});
  const fav=new Set(s.fav||[]);const ord=[...[...ph,...ai].filter(x=>fav.has(x.k)),...ph.filter(x=>!fav.has(x.k)),...ai.filter(x=>!fav.has(x.k))];
  const n=Math.max(0,+(s.prints!=null?s.prints:simPrints(s))||0);return {fotos:ord.slice(0,n),todas:ord,semFoto:Math.max(0,n-ord.length),n};}
// estado da impressão de uma venda paga: nao_se_aplica | pendente | impressa (alvo = quantas fotos imprimir; feitas = chaves já impressas)
function impIniciar(s){const f=impFotos(s);s.impressao={estado:f.n>0&&f.fotos.length>0?'pendente':'nao_se_aplica',alvo:f.fotos.length,semFoto:f.semFoto,feitas:[]};s.impressoes=s.impressoes||[];}
const impFalta=s=>{const im=s.impressao||{};return Math.max(0,(im.alvo||0)-(im.feitas||[]).length);};
state.impSel={};state.impJob=null;state.impRe=null;
// seleção da próxima impressão: a do vendedor (state.impSel) ou as primeiras que faltam
function impSel(card,s){const f=impFotos(s);const feitas=new Set((s.impressao&&s.impressao.feitas)||[]);const pode=f.todas.filter(x=>!feitas.has(x.k));const max=impFalta(s);
  const esc0=state.impSel[card];const sel=Array.isArray(esc0)?pode.filter(x=>esc0.includes(x.k)):pode.slice(0,max);return {sel:sel.slice(0,max),pode,max,semFoto:f.semFoto};}
// montagem da foto de IA para imprimir: o mesmo pedido da prévia (compose), com o fundo de 5000 px e a foto original; saída 1844×1240 (10×15 a 300 dpi, com sangria)
const IMP_PX=[1844,1240];
// v84: a impressão monta com o recorte local (fiaMontar, fundo de 5000 px) e só usa o Photoroom com o interruptor do Painel de controle
async function compHi(photoId,bgId){if(fundosModo()==='photoroom')return compHiPR(photoId,bgId);return fiaMontar(photoId,bgId,{hi:true});}
async function compHiPR(photoId,bgId){const bg=bgOf(bgId);if(!bg)return {err:'fundo não encontrado'};const avisos=[];
  let fonte=bg.fileHi||bg.file;let plate=bg.fileHi?await loadImg(bg.fileHi):null;if(!plate){plate=await plateImg(bgId);fonte=bg.file;avisos.push('fundo_2400');} // sem o fundo de 5000 px: imprime com o de 2400 e registra
  if(!plate)return {err:'fundo não abriu'};if(!state.pr){try{state.pr=await (await fetch(state.agent.url+'/photoroom/status',{cache:'no-store'})).json();}catch(e){}}const pr=state.pr;if(!pr||!pr.configured)return {err:'Photoroom indisponível'};
  const k0=Math.min(1,5000/Math.max(plate.naturalWidth,plate.naturalHeight));const W=Math.round(plate.naturalWidth*k0),H=Math.round(plate.naturalHeight*k0); // teto de 5000 px do agente
  // pede só o recorte da pessoa (PNG transparente) já posicionado em W×H; o fundo de 5000 px entra aqui. hi: se o Photoroom montar mesmo assim, o agente usa o fundo de impressão do mapa aprovado
  const body={bg:bgId,W,H,pad:bgPad(bg,W,H),hi:true,recorte:true};
  if(/^ag_/.test(photoId))body.pid=photoId.slice(3);else{const c=await photoCanvas(photoId);if(!c)return {err:'sem foto'};body.image_b64=c.toDataURL('image/jpeg',.92);}
  let r;try{r=await (await fetch(state.agent.url+'/photoroom/compose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})).json();}catch(e){return {err:'agente fora'};}
  if(!r||!r.ok||!r.url)return {err:(r&&r.error)||'Photoroom não respondeu'};const im=await loadImg(state.agent.url+r.url);if(!im)return {err:'resultado não abriu'};
  const opaca=imgOpaca(im);if(opaca)avisos.push('montagem_opaca'); // o Photoroom devolveu a foto já montada (o agente usou o fundo de impressão do mapa)
  const c=mkc(W,H);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(plate,0,0,W,H);x.drawImage(im,0,0,W,H); // recorte transparente: o fundo em alta fica por baixo
  if(bg.pos.fg){const fy=bg.pos.fg;x.drawImage(plate,0,fy*H,W,H*(1-fy),0,fy*H,W,H*(1-fy));}
  const land=W>=H;const [ow,oh]=land?IMP_PX:[IMP_PX[1],IMP_PX[0]];const k=Math.max(ow/W,oh/H);const sw=ow/k,sh=oh/k; // recorta para a proporção da página, centralizado
  const o=mkc(ow,oh);const ox=o.getContext('2d');ox.imageSmoothingQuality='high';if(bg.mono)ox.filter=bg.mono==='sepia'?'grayscale(1) sepia(.38) contrast(1.02)':'grayscale(1) contrast(1.04)';
  ox.drawImage(c,(W-sw)/2,(H-sh)/2,sw,sh,0,0,ow,oh);return {url:o.toDataURL('image/jpeg',.92),w:ow,h:oh,fonte,avisos};}
// imagem sem nenhum pixel transparente (amostra em 64×64)
function imgOpaca(im){try{const c=mkc(64,64);const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,64,64);const d=x.getImageData(0,0,64,64).data;for(let i=3;i<d.length;i+=4)if(d[i]<250)return false;return true;}catch(e){return false;}}
const espera=(p,ms,v)=>Promise.race([p,new Promise(z=>setTimeout(()=>z(v),ms))]);
// #print-root fora do #main: uma página .pr-pg por foto; foto deitada ganha .land (girada 90°). Devolve {ok,falhas,falhasIA,avisos}.
async function printMontar(fotos,ed){ed=ed||SIM.edits||{};let root=document.getElementById('print-root');if(root)root.remove();root=document.createElement('div');root.id='print-root';root.setAttribute('aria-hidden','true');document.body.appendChild(root);
  const res={ok:[],falhas:[],falhasIA:[],avisos:[]};const pgs=[];
  const prep=await Promise.all(fotos.map(async f=>{
    if(f.t==='ai'){const r=await espera(compHi(f.id,f.bg),60000,{err:'tempo'});if(!r||!r.url){res.falhasIA.push(f.k);return null;}(r.avisos||[]).forEach(a=>res.avisos.push({k:f.k,aviso:a}));return {f,src:r.url,st:'',fundo:r.fonte};}
    if(/^ag_/.test(f.id)&&state.agent&&state.agent.url)return {f,src:state.agent.url+'/file/'+f.id.slice(3),st:editStyleObj(ed[f.id])};
    const c=await photoCanvas(f.id);if(!c){res.falhas.push(f.k);return null;}return {f,src:c.toDataURL('image/jpeg',.92),st:editStyleObj(ed[f.id])};}));
  prep.filter(Boolean).forEach(p=>{const pg=document.createElement('div');pg.className='pr-pg';pg.dataset.k=p.f.k;const bx=document.createElement('div');bx.className='pr-box';const im=document.createElement('img');
    im.alt='';im.setAttribute('style',String(p.st||'').replace(/^;/,''));if(p.fundo)im.dataset.fundo=p.fundo;im.dataset.t=p.f.t;im.src=p.src;bx.appendChild(im);pg.appendChild(bx);root.appendChild(pg);pgs.push([pg,im,p.f]);});
  await espera(Promise.all(pgs.map(([,im])=>im.decode().catch(()=>null))),15000,null);
  pgs.forEach(([pg,im,f])=>{if(!im.complete||!im.naturalWidth){pg.remove();(f.t==='ai'?res.falhasIA:res.falhas).push(f.k);return;}if(im.naturalWidth>im.naturalHeight)pg.classList.add('land');res.ok.push(f.k);});
  return res;}
// imprime: monta, chama window.print() (com --kiosk-printing sai direto na DNP) e, depois do afterprint (uma vez só), pergunta se saiu certo.
// re = {sel:[chaves já impressas], motivo}: reimpressão das fotos escolhidas pelo vendedor (o rolo só baixa no "Saiu certo")
async function impImprimir(card,re){simFresh();const s=SIM.sessions[card];const im=s&&s.impressao;
  if(!s||s.status!=='paga'||!im){toast('Esta venda não está paga');render();return;}
  let fotos;if(re){if(im.estado!=='impressa'){toast('Reimpressão só depois da primeira impressão');render();return;}const feitas=im.feitas||[];fotos=impFotos(s).todas.filter(x=>feitas.includes(x.k)&&re.sel.includes(x.k)).slice(0,impReMax(s));}
  else{if(im.estado!=='pendente'){toast('Esta venda já foi impressa');state.impSel[card]=null;render();return;}fotos=impSel(card,s).sel;}
  if(!fotos.length){toast('Marque as fotos para imprimir');return;}
  const job={card,fase:'montando',re:re?{motivo:re.motivo}:null,fotos:fotos.map(x=>x.k),at:Date.now(),t0:performance.now()};state.impJob=job;render();
  const r=await printMontar(fotos,SIM.edits);if(state.impJob!==job)return;job.res=r;
  if(!r.ok.length){job.fase='erro';document.body.classList.remove('pr-on');toast('Nenhuma foto ficou pronta para imprimir. Tente de novo.');render();return;}
  if(state.agent&&state.agent.on&&state.agent.impressora){ // servidor com impressora (ETERNA_IMPRESSORA): a foto sai lá, não na impressora de quem clicou
    job.fase='imprimindo';render();let tM=0;try{const imgs=[];for(const im of document.querySelectorAll('#print-root img')){ // 10x15 a 300 dpi = 1800 px no lado maior: mais que isso só pesa no envio
      const k=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);const x=c.getContext('2d');const fl=(im.style&&im.style.filter)||'';if(fl)x.filter=fl;x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);imgs.push(c.toDataURL('image/jpeg',.92));}
      tM=performance.now();
      const rr=await (await fetch(state.agent.url+'/imprimir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({venda:s.saleNo||card,imagens:imgs})})).json();
      if(state.impJob!==job)return;if(!rr.ok)throw new Error(rr.error||'falha');job.fase='impresso';const tF=performance.now();
      toast(`Enviado para ${rr.impressora}: ${rr.fotos} ${rr.fotos===1?'foto':'fotos'} em ${((tF-job.t0)/1000).toFixed(1)} s (montar ${((tM-job.t0)/1000).toFixed(1)} s · enviar ${((tF-tM-(rr.gravar_ms+rr.spooler_ms))/1000).toFixed(1)} s · Windows ${(rr.spooler_ms/1000).toFixed(1)} s)`);}
    catch(e){job.fase='erro';toast('A impressora do servidor não imprimiu: '+String(e&&e.message||e).slice(0,140));}
    document.getElementById('print-root')?.remove();render();return;}
  document.body.classList.add('pr-on');job.fase='imprimindo';
  const fim=()=>{if(job.fase!=='imprimindo')return;job.fase='impresso';document.body.classList.remove('pr-on');render();}; // depois do afterprint, um print() qualquer volta a imprimir a tela
  window.addEventListener('afterprint',fim,{once:true});try{window.print();}catch(e){}setTimeout(fim,0);}
const impReMax=s=>{const f=((s.impressao&&s.impressao.feitas)||[]).length;return Math.max(1,Math.min(+s.prints||f,f));}; // até prints por reimpressão
// "Saiu certo": baixa do rolo uma vez por foto. Primeira impressão: só as que ainda não estavam feitas (com todas feitas, a venda vira impressa).
// Reimpressão: grava a lista exata e baixa as que saíram.
function impOk(card){const job=state.impJob;simFresh();const s=SIM.sessions[card];const im=s&&s.impressao;
  if(!job||job.card!==card||!job.res||job.fase!=='impresso'){toast(im&&im.estado==='impressa'&&!(job&&job.re)?'Esta impressão já foi registrada':'Imprima antes de marcar');if(job&&job.card===card&&job.fase!=='montando')state.impJob=null;render();return;}
  if(!im||(job.re?im.estado!=='impressa':im.estado!=='pendente')){toast('Esta impressão já foi registrada');state.impJob=null;render();return;}
  const antes=JSON.stringify(SIM);const u=state.user;const at=now().toISOString();const r=job.res;const pn=postoNome();im.feitas=im.feitas||[];
  const novas=job.re?r.ok.slice():r.ok.filter(k=>!im.feitas.includes(k));if(!job.re)im.feitas.push(...novas);
  SIM.stock[pn]=Math.max(0,(SIM.stock[pn]!=null?SIM.stock[pn]:ROLO_CAP)-novas.length);
  const reg={em:at,porNome:u.name,resultado:'ok',n:novas.length,reimpressao:!!job.re,motivo:job.re?job.re.motivo:null,fotos:novas,semFoto:job.re?0:(im.semFoto||0),posto:pn,avisos:r.avisos.map(a=>a.aviso),falhasIA:r.falhasIA.slice()};s.impressoes=s.impressoes||[];s.impressoes.push(reg);
  const tudo=job.re||im.feitas.length>=(im.alvo||0);if(!job.re&&tudo){im.estado='impressa';im.n=im.feitas.length;im.em=at;im.porNome=u.name;}
  log(`${job.re?'Reimpressão':'Impressão'} ${s.saleNo||card}: ${novas.length} ${novas.length===1?'foto':'fotos'} 10×15 em ${pn}${job.re?' ('+job.re.motivo+')':''}`);
  if(!saveSim()){SIM=Object.assign(SIM0(),JSON.parse(antes));toast('Não gravou, tente de novo');render();return;}
  pvEvento('impressao',s.vendaId,{resultado:'ok',fotos:novas,n:novas.length,reimpressao:!!job.re,motivo:reg.motivo,semFoto:reg.semFoto,avisos:reg.avisos});
  state.impJob=null;state.impSel[card]=null;document.body.classList.remove('pr-on');
  toast(job.re?'Reimpressão registrada.':tudo?'Impressão registrada.':`Faltam ${impFalta(s)} ${impFalta(s)===1?'foto':'fotos'}: imprima de novo.`);render();}
// "Não saiu": registra a tentativa (com a lista exata), não baixa estoque; a primeira impressão continua pendente
function impFalha(card){const job=state.impJob;simFresh();const s=SIM.sessions[card];const im=s&&s.impressao;
  if(!job||job.card!==card||job.fase!=='impresso'||!im){toast('Imprima antes de marcar');render();return;}
  const antes=JSON.stringify(SIM);const u=state.user;const fotos=(job.res&&job.res.ok||job.fotos).slice();
  s.impressoes=s.impressoes||[];s.impressoes.push({em:now().toISOString(),porNome:u.name,resultado:'nao_saiu',n:0,reimpressao:!!job.re,motivo:job.re?job.re.motivo:null,fotos,semFoto:job.re?0:(im.semFoto||0),posto:postoNome()});
  if(!saveSim()){SIM=Object.assign(SIM0(),JSON.parse(antes));toast('Não gravou, tente de novo');render();return;}
  pvEvento('impressao',s.vendaId,{resultado:'nao_saiu',fotos,n:fotos.length,reimpressao:!!job.re,motivo:job.re?job.re.motivo:null,semFoto:job.re?0:(im.semFoto||0)});
  state.impJob=null;document.body.classList.remove('pr-on');toast('Registrado. Confira a impressora e imprima de novo.');render();}
const IMP_MOTIVOS=[['falhou','Falhou'],['copia','Outra cópia'],['cor','Cor'],['outro','Outro']];
// reimpressão: o vendedor escolhe quais das fotos já impressas (até prints por vez) e o motivo; imprime e depois marca "Saiu certo" ou "Não saiu"
function impReimprimir(card){const re=state.impRe;simFresh();const s=SIM.sessions[card];const im=s&&s.impressao;
  if(!re||re.card!==card||!im||im.estado!=='impressa'){toast('Abra a reimpressão de novo');state.impRe=null;render();return;}
  const sel=(re.sel||[]).filter(k=>(im.feitas||[]).includes(k));if(!sel.length){toast('Marque as fotos para reimprimir');return;}if(sel.length>impReMax(s)){toast(`No máximo ${impReMax(s)} por reimpressão`);return;}
  if(!re.motivo){toast('Escolha o motivo da reimpressão');return;}
  state.impRe=null;impImprimir(card,{sel,motivo:re.motivo});}
// texto da impressão para a lista e o CSV: estado e nome de quem imprimiu (nunca e-mail)
function impTxt(s){const im=s&&s.impressao;if(!im)return '';const re=(s.impressoes||[]).filter(x=>x.reimpressao&&x.resultado==='ok');
  let t=im.estado==='impressa'?`impressa${im.porNome?' por '+im.porNome:''}`:im.estado==='pendente'?'pendente':'sem impressão';
  if(re.length)t+=` · reimpressão ${re.map(x=>x.n+' ('+((IMP_MOTIVOS.find(m=>m[0]===x.motivo)||[0,x.motivo])[1]).toLowerCase()+')').join(', ')}`;if(im.semFoto)t+=` · ${im.semFoto} sem foto`;return t;}
// vendas pagas deste notebook com impressão (pendentes sempre; impressas só de hoje). cards = só estas (recibo do Caixa)
function impVendas(cards){return Object.entries(SIM.sessions).filter(([c,s])=>s.status==='paga'&&s.impressao&&s.impressao.estado!=='nao_se_aplica'&&(cards?cards.includes(c):(s.impressao.estado==='pendente'||isoDia(s.paidAt||0)===todayISO())))
  .sort((a,b)=>String(b[1].paidAt||'').localeCompare(String(a[1].paidAt||'')));}
function impThumb(x,on,act,card){const st=x.t==='ph'?phStyle(x.id):'';const b=x.t==='ai'?bgOf(x.bg):null;
  return `<button class="imp-th${on?' on':''}" ${act?`data-act="${act}" data-card="${esc(card)}" data-k="${esc(x.k)}"`:'disabled'} aria-pressed="${!!on}" style="${st}" aria-label="${x.t==='ai'?'Foto com fundo de IA':'Foto'}">${x.t==='ai'?`<span class="compimg" data-comp="${esc(x.id)}|${esc(x.bg)}" style="background-image:url(${b?b.file:''})"></span><span class="imp-ia">IA</span>`:''}${on?'<span class="imp-ok">✓</span>':''}</button>`;}
function impPainel(cards){const L=impVendas(cards);const rw=can('venda','c');
  if(!L.length&&cards){const s0=SIM.sessions[cards[0]]||{};return `<div class="panel" id="imp-painel"><div class="note">${s0.impressao?'Esta venda não tem fotos impressas no pacote.':'Esta venda é de antes da impressão pelo Posto de venda (v83): não há fotos registradas para imprimir aqui.'}</div></div>`;}
  const item=([card,s])=>{const im=s.impressao;const job=state.impJob&&state.impJob.card===card?state.impJob:null;const hora=s.paidAt?hhmm(new Date(s.paidAt)):'';
    const head=`<div class="din-top"><b>${esc(s.saleNo||card)}</b><span class="pill ${im.estado==='impressa'?'good':'warn'}">${im.estado==='impressa'?'impressa':'para imprimir'}</span></div><div class="note">Sessão ${esc(card)} · paga às ${hora} · ${esc(s.payment||'')} · ${s.prints||0} ${s.prints===1?'impressa':'impressas'} no pacote</div>`;
    let body='';
    if(im.estado==='pendente'){const S=impSel(card,s);const selK=new Set(S.sel.map(x=>x.k));const feitas=new Set(im.feitas||[]);
      const nota=S.semFoto?`<div class="note"><span class="pill bad">${S.semFoto} ${S.semFoto===1?'impressão sem foto':'impressões sem foto'}</span></div>`:'';
      const ult=(s.impressoes||[]).slice(-1)[0];const falhaIA=ult&&ult.falhasIA&&ult.falhasIA.length?`<div class="note"><span class="pill warn">Não deu para montar o fundo: tente de novo</span></div>`:'';
      if(job&&job.fase==='montando')body=`<div class="note"><span class="pill neutral">Preparando ${job.fotos.length} ${job.fotos.length===1?'foto':'fotos'} para a impressora...</span></div>`;
      else if(job&&(job.fase==='imprimindo'||job.fase==='impresso')){const r=job.res||{ok:[],falhasIA:[],falhas:[]};
        body=`<div class="note">${r.ok.length} ${r.ok.length===1?'foto enviada':'fotos enviadas'} para a impressora deste posto.</div>${r.falhasIA.length?`<div class="note"><span class="pill warn">Não deu para montar o fundo: tente de novo</span> ${r.falhasIA.length} ${r.falhasIA.length===1?'foto com fundo de IA ficou':'fotos com fundo de IA ficaram'} de fora.</div>`:''}${r.falhas.length?`<div class="note"><span class="pill warn">${r.falhas.length} ${r.falhas.length===1?'foto não abriu':'fotos não abriram'}</span></div>`:''}
          ${rw?`<div class="row"><button class="btn primary" data-act="imp-ok" data-card="${esc(card)}">Saiu certo</button><button class="btn ghost" data-act="imp-falha" data-card="${esc(card)}">Não saiu</button></div>`:''}`;}
      else body=`${feitas.size?`<div class="note">${feitas.size} já ${feitas.size===1?'impressa':'impressas'}; faltam ${S.max}.</div>`:''}${falhaIA}
        <div class="imp-grid">${S.pode.map(x=>impThumb(x,selK.has(x.k),rw?'imp-pick':null,card)).join('')}</div>

        ${rw?`<div class="row"><button class="btn primary" data-act="imp-print" data-card="${esc(card)}" ${S.sel.length?'':'disabled'}>Imprimir ${S.sel.length} ${S.sel.length===1?'foto':'fotos'} (10×15)</button></div>`:''}`;}
    else{const re=state.impRe&&state.impRe.card===card?state.impRe:null;const max=impReMax(s);const nre=(s.impressoes||[]).filter(x=>x.reimpressao&&x.resultado==='ok');const feitas=new Set(im.feitas||[]);
      const jr=job&&job.re?job:null;const r=jr&&jr.res||{ok:[],falhasIA:[],falhas:[]};
      body=`<div class="note">Impressa${im.porNome?' por '+esc(im.porNome):''}${im.em?' às '+hhmm(new Date(im.em)):''} · ${im.n||0} ${im.n===1?'foto':'fotos'}${nre.length?` · ${nre.length} ${nre.length===1?'reimpressão':'reimpressões'}`:''}</div>
        ${jr&&jr.fase==='montando'?'<div class="note"><span class="pill neutral">Preparando a reimpressão...</span></div>':''}
        ${jr&&(jr.fase==='imprimindo'||jr.fase==='impresso')?`<div class="note">Reimpressão: ${r.ok.length} ${r.ok.length===1?'foto enviada':'fotos enviadas'} para a impressora.</div>${r.falhasIA.length?'<div class="note"><span class="pill warn">Não deu para montar o fundo: tente de novo</span></div>':''}
          ${rw?`<div class="row"><button class="btn primary" data-act="imp-ok" data-card="${esc(card)}">Saiu certo</button><button class="btn ghost" data-act="imp-falha" data-card="${esc(card)}">Não saiu</button></div>`:''}`
        :!rw||jr?'':re?`<div class="din-conf"><span class="eyebrow">Quais fotos reimprimir (até ${max})</span>
          <div class="imp-grid">${impFotos(s).todas.filter(x=>feitas.has(x.k)).map(x=>impThumb(x,(re.sel||[]).includes(x.k),'imp-repick',card)).join('')}</div>
          <div class="chips">${IMP_MOTIVOS.map(([k,l])=>`<button class="chip" data-act="imp-motivo" data-m="${k}" aria-pressed="${re.motivo===k}">${l}</button>`).join('')}</div>
          <div class="row"><button class="btn primary" data-act="imp-reprint-ok" data-card="${esc(card)}" ${(re.sel||[]).length?'':'disabled'}>Reimprimir ${(re.sel||[]).length||''} ${(re.sel||[]).length===1?'foto':'fotos'}</button><button class="btn ghost" data-act="imp-reprint-no">Voltar</button></div></div>`
          :`<div class="row"><button class="btn ghost" data-act="imp-reprint" data-card="${esc(card)}">Reimprimir</button></div>`}`;}
    return `<div class="din-item" data-imp="${esc(card)}">${head}${body}</div>`;};
  return `<div class="panel" id="imp-painel"><div class="head"><h2>Impressão 10×15</h2><span class="pill ${(SIM.stock[postoNome()]||0)<ROLO_ALERTA?'bad':'neutral'}">Rolo: ${SIM.stock[postoNome()]!=null?SIM.stock[postoNome()]:ROLO_CAP} de ${ROLO_CAP}</span></div>
    ${L.length?`<div class="din-list">${L.map(item).join('')}</div>`:'<div class="note">Nenhuma venda para imprimir. Depois de confirmar o pagamento, as fotos aparecem aqui já marcadas.</div>'}
    <div class="note">Sai na DNP RX1HS deste posto, em 10×15 (PR 4×6, sem margem). Foto com fundo de IA imprime com o fundo em alta resolução.</div></div>`;}
// "Minhas vendas de hoje" (D9): deste notebook e do e-mail de quem está logado; valor de cada venda e nenhum total
function minhasVendas(){const u=state.user;if(!u)return '';const hoje=todayISO();const rows=[];const vistos=new Set();
  (SIM.caixaDin||[]).forEach(r=>{if(!r.vendedor||r.vendedor.email!==u.email||isoDia(r.criada)!==hoje)return;vistos.add(r.id);const s=SIM.sessions[r.card]||{};const meu=s.vendaId===r.id;
    rows.push({t:r.criada,no:r.saleNo||'',meio:MEIO_NOME[meioDe(r)],v:r.total,pag:r.estado==='aguardando'?'aguardando':r.estado==='confirmada'?'paga':r.estado==='nao_paga'?'não paga':r.estado,imp:meu&&s.impressao?(s.impressao.estado==='impressa'?'impressa':s.impressao.estado==='pendente'?'para imprimir':'—'):'—'});});
  Object.entries(SIM.sessions).forEach(([c,s])=>{if(s.status!=='paga'||!s.vendaId||vistos.has(s.vendaId)||!s.vendedor||s.vendedor.email!==u.email||isoDia(s.paidAt||0)!==hoje)return;
    rows.push({t:s.paidAt,no:s.saleNo||'',meio:s.payment||'',v:saleTotal(s),pag:'paga',imp:s.impressao?(s.impressao.estado==='impressa'?'impressa':s.impressao.estado==='pendente'?'para imprimir':'—'):'—'});});
  rows.sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  return `<div class="panel" id="minhas-vendas"><div class="head"><h2>Minhas vendas de hoje</h2></div>${rows.length?`<div class="tablewrap"><table class="mv-tab"><thead><tr><th>Hora</th><th>Venda</th><th>Pagamento</th><th class="num">Valor</th><th>Estado</th><th>Impressão</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${hhmm(new Date(r.t))}</td><td class="name">${esc(r.no)}</td><td>${esc(r.meio)}</td><td class="num">${fmtR(r.v)}</td><td>${esc(r.pag)}</td><td>${esc(r.imp)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="note">Nenhuma venda sua hoje neste notebook.</div>'}</div>`;}

  if(k.code&&(k.step==='review'||k.step==='cart'||k.step==='done')&&sessionObj(k.code)){const items=lojaItems(k.code);const pk=lojaPick(k.code);const c=lojaCart(k.code);

// segurança (S1): a mensagem do canal vira uma lista fechada de campos conhecidos; números viram número e textos só de listas ou formatos conhecidos
const ECO_ID=/^[A-Za-z0-9_|:-]{1,80}$/;
function ecoNorm(m){if(!m||typeof m!=='object')return null;if(m.tipo==='fim')return {tipo:'fim'};const n=v=>{v=+v;return isFinite(v)?v:0;};const id=v=>typeof v==='string'&&ECO_ID.test(v)?v:null;
  const foto=x=>x&&typeof x==='object'&&id(x.id)?{t:x.t==='ai'?'ai':'ph',id:id(x.id),bg:id(x.bg),st:['ok','fav','no'].includes(x.st)?x.st:'',fav:!!x.fav}:null;
  const pk=v=>DATA.catalog.some(c=>c.id===v&&c.kind==='pacote')?v:null;
  const o={tipo:'estado',em:n(m.em),step:['review','cart','done'].includes(m.step)?m.step:'code',lang:LANGS.some(l=>l[0]===m.lang)?m.lang:'pt'};
  if(o.step!=='code'&&id(m.card)){o.card=m.card;o.i=Math.max(0,Math.floor(n(m.i)));o.n=Math.max(0,Math.floor(n(m.n)));o.foto=foto(m.foto);o.esc=(Array.isArray(m.esc)?m.esc:[]).slice(0,60).map(foto).filter(Boolean);
    o.pkg=pk(m.pkg);o.ideal=pk(m.ideal);o.lines=(Array.isArray(m.lines)?m.lines:[]).slice(0,4).map(l=>({t:l&&l.t==='pkg'?'pkg':'extra',n:Math.max(0,Math.floor(n(l&&l.n))),v:n(l&&l.v)}));
    o.total=m.total==null?null:n(m.total);o.prints=Math.max(0,Math.floor(n(m.prints)));o.pay=['card','pix','cash'].includes(m.pay)?m.pay:null;}
  if(o.step==='done'){o.pend=id(m.pend);o.wait=!!m.wait;if(m.total!=null)o.total=n(m.total);o.meio=MEIO_NOME[m.meio]?m.meio:null;}
  return o;}
if(ECO_CH)ECO_CH.onmessage=ev=>{const q=ev.data;
  if(q&&q.tipo==='mostrar-qr'){if(!state.lojaRota||typeof q.token!=='string'||!/^[A-Za-z0-9_-]{8,40}$/.test(q.token))return;const k=state.kiosk;lojaTimerOff();k.code=typeof q.card==='string'?q.card:k.code;

// tentativas por galeria neste navegador (sessionStorage): 5 erros bloqueiam por 15 min. Só contador e hora, nada de imagem.
function pubTries(p){const k='eterna.gq.'+p.token.slice(0,8);let o={n:0,ate:0};try{o=JSON.parse(sessionStorage.getItem(k)||'null')||o;}catch(e){}return {o,save(){try{sessionStorage.setItem(k,JSON.stringify(o))}catch(e){}}};}

  if(t.o.ate&&t.o.ate>Date.now()){p.step='nao';p.motivo='bloqueado';p.ate=t.o.ate;selfieStop();render();return;}
  p.step='buscando';selfieStop();render();

    if(p.modo==='agente'){const body=JSON.stringify({consentimento:true,versao:GQ_VERSAO+(galNuvem()?'-aws':''),idioma:lang(),imagem:src});src=null;
      const r=await fetch(galApi()+'/g/'+p.token+'/rosto',{method:'POST',headers:{'Content-Type':'application/json'},body});const j=await r.json().catch(()=>({}));
      if(state.pub!==p)return;
      if(r.status===429){p.step='nao';p.motivo='bloqueado';p.ate=Date.parse(j.ate)||Date.now()+GQ_BLOQ;}
      else if(r.status===503){p.step='nao';p.motivo='processando';}
      else if(j.ok){p.acesso=j.acesso;p.gal=j.galeria;p.galAt=Date.now();p.aviso=null;p.step='galeria';t.o.n=0;t.save();}
      else{p.step='nao';p.motivo=j.motivo==='sem_rosto'?'sem_rosto':'nao_encontrado';p.restam=j.restam!=null?j.restam:p.restam;}}
    else{const m=SIM.galerias[p.token];let im=await loadImg(src);src=null;if(!im){pubFalhou(p,'sem_rosto');return;}
      const r=await faceFind(im,x=>m.sessoes.includes(x.card));im=null;if(state.pub!==p)return;
      if(r.semRosto){pubFalhou(p,'sem_rosto');return;}
      if(m.tipo==='evento'){const pids=Object.entries(r.sims||{}).filter(([id,sc])=>sc>=GAL_LIMITE_MENOR).map(([id])=>id);
        if(pids.length){p.match=pids;p.step='galeria';t.o.n=0;t.save();}else pubFalhou(p,'nao_encontrado');}
      else{const top=r.list[0];if(top&&top.sc>=FACE_SIM&&top.card===m.sessoes[0]){p.step='galeria';t.o.n=0;t.save();}else pubFalhou(p,'nao_encontrado');}}
  }catch(e){if(state.pub===p){p.step='nao';p.motivo='processando';}}
  finally{src=null;selfieStop();if(state.pub===p)render();}}

 gq_consentSelf:['Concordo que a minha selfie seja usada só para encontrar as minhas fotos desta visita. Ela é comparada na hora e descartada (LGPD).','I agree that my selfie is used only to find my photos from this visit. It is compared on the spot and discarded (LGPD).','Acepto que mi selfie se use solo para encontrar mis fotos de esta visita. Se compara en el momento y se descarta (LGPD).','J’accepte que mon selfie serve uniquement à retrouver mes photos de cette visite. Il est comparé sur place puis supprimé (LGPD).','Ich bin einverstanden, dass mein Selfie nur verwendet wird, um meine Fotos von diesem Besuch zu finden. Es wird sofort verglichen und gelöscht (LGPD).'],
 gq_consentKid:['Sou mãe, pai ou responsável legal pela criança e autorizo o uso da foto do rosto dela só para encontrar as fotos desta visita. A foto é comparada na hora e descartada (LGPD, art. 14).','I am the child’s parent or legal guardian and I authorise the use of the child’s face photo only to find the photos from this visit. It is compared on the spot and discarded (LGPD, art. 14).','Soy madre, padre o tutor legal del niño o la niña y autorizo el uso de la foto de su rostro solo para encontrar las fotos de esta visita. La foto se compara en el momento y se descarta (LGPD, art. 14).','Je suis le parent ou le responsable légal de l’enfant et j’autorise l’utilisation de la photo de son visage uniquement pour retrouver les photos de cette visite. Elle est comparée sur place puis supprimée (LGPD, art. 14).','Ich bin Elternteil oder Erziehungsberechtigte(r) des Kindes und erlaube, das Gesichtsfoto des Kindes nur zum Finden der Fotos von diesem Besuch zu verwenden. Es wird sofort verglichen und gelöscht (LGPD, Art. 14).'],
 gq_consentSelfNuvem:['Concordo que a minha selfie seja usada só para encontrar as minhas fotos desta visita. A comparação é feita pela Amazon Web Services (AWS), nos Estados Unidos, só com os rostos das fotos desta galeria. A selfie não fica guardada, e os dados de rosto das fotos são apagados quando a galeria vence (LGPD).','I agree that my selfie is used only to find my photos from this visit. The comparison is done by Amazon Web Services (AWS), in the United States, only against the faces in this gallery’s photos. The selfie is not stored, and the face data from the photos is deleted when the gallery expires (LGPD).','Acepto que mi selfie se use solo para encontrar mis fotos de esta visita. La comparación la hace Amazon Web Services (AWS), en Estados Unidos, solo con los rostros de las fotos de esta galería. La selfie no se guarda y los datos faciales de las fotos se borran cuando vence la galería (LGPD).','J’accepte que mon selfie serve uniquement à retrouver mes photos de cette visite. La comparaison est faite par Amazon Web Services (AWS), aux États-Unis, uniquement avec les visages des photos de cette galerie. Le selfie n’est pas conservé et les données faciales des photos sont supprimées à l’expiration de la galerie (LGPD).','Ich bin einverstanden, dass mein Selfie nur verwendet wird, um meine Fotos von diesem Besuch zu finden. Der Vergleich erfolgt durch Amazon Web Services (AWS) in den USA, nur mit den Gesichtern auf den Fotos dieser Galerie. Das Selfie wird nicht gespeichert, und die Gesichtsdaten der Fotos werden gelöscht, wenn die Galerie abläuft (LGPD).'],
 gq_consentKidNuvem:['Sou mãe, pai ou responsável legal pela criança e autorizo o uso da foto do rosto dela só para encontrar as fotos desta visita. A comparação é feita pela Amazon Web Services (AWS), nos Estados Unidos, só com os rostos das fotos desta galeria. A foto não fica guardada, e os dados de rosto das fotos são apagados quando a galeria vence (LGPD, art. 14).','I am the child’s parent or legal guardian and I authorise the use of the child’s face photo only to find the photos from this visit. The comparison is done by Amazon Web Services (AWS), in the United States, only against the faces in this gallery’s photos. The photo is not stored, and the face data from the photos is deleted when the gallery expires (LGPD, art. 14).','Soy madre, padre o tutor legal del niño o la niña y autorizo el uso de la foto de su rostro solo para encontrar las fotos de esta visita. La comparación la hace Amazon Web Services (AWS), en Estados Unidos, solo con los rostros de las fotos de esta galería. La foto no se guarda y los datos faciales de las fotos se borran cuando vence la galería (LGPD, art. 14).','Je suis le parent ou le responsable légal de l’enfant et j’autorise l’utilisation de la photo de son visage uniquement pour retrouver les photos de cette visite. La comparaison est faite par Amazon Web Services (AWS), aux États-Unis, uniquement avec les visages des photos de cette galerie. La photo n’est pas conservée et les données faciales des photos sont supprimées à l’expiration de la galerie (LGPD, art. 14).','Ich bin Elternteil oder Erziehungsberechtigte(r) des Kindes und erlaube, das Gesichtsfoto des Kindes nur zum Finden der Fotos von diesem Besuch zu verwenden. Der Vergleich erfolgt durch Amazon Web Services (AWS) in den USA, nur mit den Gesichtern auf den Fotos dieser Galerie. Das Foto wird nicht gespeichert, und die Gesichtsdaten der Fotos werden gelöscht, wenn die Galerie abläuft (LGPD, Art. 14).'],

async function faceFind(srcs,ok){srcs=[].concat(srcs);

const FIA_LADO_PREVIA=2400,FIA_LADO_HI=3000;
function fiaRecorte(photoId,lado){lado=lado===FIA_LADO_HI?FIA_LADO_HI:FIA_LADO_PREVIA;const key=photoId+'|'+lado;
  if(RECS.has(key)){const p=RECS.get(key);RECS.delete(key);RECS.set(key,p);return p;}

    if(r.status===503){let j={};try{j=await r.json();}catch(e){}return {pending:'recorte',motivo:j.motivo||null};}
    if(r.status===429||r.status===504)return {pending:'fila'};

function fiaMedir(im){const W0=im.naturalWidth||im.width,H0=im.naturalHeight||im.height;const k=Math.min(1,600/Math.max(W0,H0));const w=Math.max(1,Math.round(W0*k)),h=Math.max(1,Math.round(H0*k));

// rostos (opcional, fração da altura do recorte): a linha de corte desce até a base do rosto mais baixo que ela cortaria + 15% dele.

function compMsg(r){return r.pending==='photoroom'?'Conecte o Photoroom em Fundos de IA':r.pending==='agente'?'Abra o Eterna pelo agente do ponto':r.pending==='recorte'?recMotivo(r.motivo):r.pending==='exemplo'?'Foto de exemplo: o recorte é só para fotos do agente':r.err==='sem_pessoa'?'Ninguém encontrado na foto':r.err==='photoroom_desligado'?'Photoroom desligado no agente: ligue em Painel de controle':esc(r.err||'não deu');}
function compHydrate(){if(fundosModo()==='photoroom'&&document.querySelector('[data-comp]:not([data-done])')&&!state.pr)prPoll();document.querySelectorAll('[data-comp]:not([data-done])').forEach(el=>{el.dataset.done='1';const [ph,bg]=el.dataset.comp.split('|');const key=ph+'|'+bg;

    if(r.pending==='fila'){if(!el.querySelector('.lj-aimk'))el.innerHTML='<span class="compst">Na fila do recorte...</span>';setTimeout(()=>{if(el.isConnected){delete el.dataset.done;compHydrate();}},3000);return;}
    el.classList.add('pend');el.innerHTML=`<span class="compst">${compMsg(r)}</span>`;if(r.pending!=='agente'&&r.pending!=='photoroom')fiaFalhou(key,fundosModo()==='local'&&(r.pending==='recorte'||r.pending==='exemplo'||r.err==='sem_pessoa'||/recorte|foto não está/.test(r.err||'')));}).catch(()=>{el.classList.add('pend');el.innerHTML='<span class="compst">Montagem indisponível</span>';fiaFalhou(key);});});}
function compGrid(card,sel){if(!aiPrep(card))return '<div class="note">Lendo o ângulo e a luz das fotos da sessão...</div>';const bgs=aiBgsFor(card);if(!bgs.length)return '<span class="pill warn">Nenhuma foto desta sessão serve para fundo de IA</span>';

async function selfieStart(){const sf=state.guest.selfie;if(!sf||sf.stream||sf.err)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){sf.err='Este navegador não abre a câmera. Escolha uma foto do aparelho.';render();return;}
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:sf.facing||'user',width:{ideal:1280},height:{ideal:960}},audio:false});
    if(!state.guest.selfie){st.getTracks().forEach(t=>t.stop());return;}sf.stream=st;selfieMount();}
  catch(e){sf.err=e&&e.name==='NotAllowedError'?'A câmera foi bloqueada. Libere o acesso no navegador ou escolha uma foto do aparelho.':'Nenhuma câmera encontrada. Escolha uma foto do aparelho.';render();}}
function selfieMount(){const sf=state.guest.selfie;if(!(state.pub&&state.pub.modo==='agente'))faceIndexAll();const v=$('#gself-video');if(!sf||!v)return;if(!sf.stream){selfieStart();return;}
  if(v.srcObject!==sf.stream){v.srcObject=sf.stream;v.onloadeddata=()=>{if(!sf.ready){sf.ready=true;const b=$('[data-act="gself-snap"],[data-act="gq-snap"]');if(b)b.disabled=false;}};v.play().catch(()=>{});}
  if(sf.ready){const b=$('[data-act="gself-snap"],[data-act="gq-snap"]');if(b)b.disabled=false;}}
function selfieStop(){const sf=state.guest.selfie;if(sf&&sf.stream)sf.stream.getTracks().forEach(t=>t.stop());state.guest.selfie=null;}

function revSessions(){const out=DATA.sampled.slice();const seen=new Set(out.map(o=>o.card));
  Object.entries(SIM.sessions||{}).forEach(([card,x])=>{const ph=(x.photos||[]).filter(p=>hasImg(p.id));if(!ph.length||seen.has(card))return;seen.add(card);const paid=x.status==='paga';const sel=new Set(x.selected||[]);const photos=ph.map(p=>({id:p.id,sold:(p.sold||(paid&&sel.has(p.id)))?1:0}));const date=x.date==='hoje'?localDay((x.openedAt?new Date(x.openedAt).getTime():Date.now())/1000):x.date;out.push({card,key:x.key||'carlos',date,time:x.time||'',pdv:x.pdv||'',total:photos.length,soldTotal:photos.filter(p=>p.sold).length,photos,real:true});});
  // sessões da Roverpix (ao vivo, até hoje): as fotos vêm da biblioteca deste computador quando batem com o fotógrafo e a hora
  if(LIVE&&LIVE.days){Object.keys(LIVE.days).sort().forEach(d=>{const ses=LIVE.days[d].sessions||[];if(!ses.length)return;const match=liveMatch(d,ses);ses.forEach(x=>{if(seen.has(x.card))return;seen.add(x.card);const key=x.key&&P[x.key]?x.key:(x.key||'sem');const ph=(match[x.card]||[]).map(f=>({id:'ag_'+f.id,sold:0}));out.push({card:x.card,key,date:d,time:x.t0?hhmm(new Date(x.t0*1000)):'',pdv:x.pdv||'',total:x.n,soldTotal:x.sold,photos:ph,live:true,t0:x.t0,t1:x.t1});});});}
  return out;}
// Casa as sessões da Roverpix de um dia com as fotos guardadas aqui: pelo fotógrafo (câmera do dia) e pela ordem dos cliques;
// se a quantidade do dia bate, vai em sequência; senão, pela hora da captura perto da hora do envio.
// dono provável de cada câmera sem check-in, por dia (calculado ao casar a câmera com as sessões da Roverpix)
let CAM_GUESS={},CAM_GDONE={};
function camGuess(f){if(!f.serie||!LIVE||!LIVE.days)return null;const d=f.cap?localDay(f.cap):f.day;if(!CAM_GDONE[d]){CAM_GDONE[d]=1;const a=LIVE.days[d];if(a&&a.sessions&&a.sessions.length)liveMatch(d,a.sessions);}return CAM_GUESS[d+'|'+f.serie]||null;}
function liveMatch(day,ses){const out={};const lib=state.lib.filter(f=>(f.cap?localDay(f.cap):f.day)===day);if(!lib.length)return out;const ix=libIndex();
  // A Roverpix só sabe a hora em que a foto chegou lá (o cartão é lido depois de 1 a 3 famílias), não a hora do clique.
  // Então as sessões de um fotógrafo, em ordem, consomem as fotos da câmera dele em ordem de captura: cada sessão
  // leva as próximas n fotos clicadas antes de ela ter chegado. Câmera sem check-in: fica com o fotógrafo cujas
  // sessões acumuladas batem com a contagem de fotos da câmera ao longo do dia.
  const FOLGA=5*60;
  const byKey={};ses.forEach(x=>{if(!x.t0)return;const k=x.key||'?';(byKey[k]=byKey[k]||[]).push(x);});Object.values(byKey).forEach(l=>l.sort((a,b)=>(a.t0-b.t0)||(a.t1-b.t1)));
  const humanKey=k=>!/^chroma/.test(k)&&k!=='?'&&k!=='sem';
  const bySerie={};lib.forEach(f=>{if(!f.cap)return;const s=f.serie||('ftp:'+(f.origem||''));(bySerie[s]=bySerie[s]||[]).push(f);});Object.values(bySerie).forEach(a=>a.sort((p,q)=>p.cap-q.cap));
  const erro=(k,a)=>{let cum=0,e=0;const l=byKey[k];l.forEach(x=>{cum+=x.n;const got=a.filter(f=>f.cap<=x.t1+FOLGA).length;e+=Math.abs(got-cum);});return e/l.length;};
  const taken=new Set();const who={};
  Object.entries(bySerie).forEach(([sr,a])=>{const w=libWho(a[0],ix);if(w&&byKey[w]){who[sr]=w;taken.add(w);}});
  Object.entries(bySerie).forEach(([sr,a])=>{if(who[sr]||a.length<10)return;let best=null,be=Infinity;Object.keys(byKey).forEach(k=>{if(taken.has(k)||!humanKey(k))return;const e=erro(k,a);if(e<be){be=e;best=k;}});
    if(best&&be<=a.length*.2){who[sr]=best;taken.add(best);}});
  Object.entries(who).forEach(([sr,k])=>{CAM_GUESS[day+'|'+sr]=k;});
  Object.entries(bySerie).forEach(([sr,a])=>{const k=who[sr];if(!k)return;let i=0;byKey[k].forEach(x=>{const got=[];while(i<a.length&&got.length<x.n&&a[i].cap<=x.t1+FOLGA){got.push(a[i]);i++;}if(got.length)out[x.card]=got;});});
  return out;}

function validatePhoto(id){return null;}
// Validação real, depois que o grupo fecha: olhos fechados em quem está em primeiro plano.
// Abertura do olho = altura/largura dos pontos do olho (68 pontos); abaixo de 0,19 nos dois olhos = fechado.
function eyeOpen(pts){const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);return (d(pts[1],pts[5])+d(pts[2],pts[4]))/(2*d(pts[0],pts[3])||1);}
async function validateReal(ids){const f=await faceLoad();const out={};for(const id of ids){try{const c=await photoCanvas(id);if(!c)continue;
    const r=await f.detectAllFaces(c,new f.SsdMobilenetv1Options({minConfidence:.5})).withFaceLandmarks();
    if(!r.length)continue; // o detector do navegador perde rostos de ângulo difícil: "sem rosto" só pelo servidor do pontoconst big=r.sort((a,b)=>b.detection.box.area-a.detection.box.area);const lim=big[0].detection.box.width*.6;
    for(const x of big){if(x.detection.box.width<lim)break;const lm=x.landmarks;if(Math.max(eyeOpen(lm.getLeftEye()),eyeOpen(lm.getRightEye()))<.19){out[id]='olhos fechados';break;}}}catch(e){}}
  return out;}

// ---------- Gestão: alertas ----------
function alerts(){
  const out=[];
  for(const k of humans){const s=stats[k];
    s.perDay.forEach(p=>{if(!p.off&&p.ppc>45)out.push({sev:'warn',t:`${s.name}: ${p.ppc.toFixed(0)} fotos por sessão em ${dlabel(p.date)}`,d:`${fmtN(p.photos)} fotos para ${p.cards} sessões. Normal é 16 a 25. Grupos fundidos por foto preta esquecida, ou disparo contínuo.`})});
    s.perDay.forEach(p=>{if(!p.off&&p.conv<.75&&p.cards>=15)out.push({sev:'warn',t:`${s.name}: conversão de ${Math.round(p.conv*100)}% em ${dlabel(p.date)}`,d:`${p.cardsSold} de ${p.cards} sessões viraram venda. A média da equipe é 83%.`})});
    if(s.index!=null&&s.index<85)out.push({sev:'bad',t:`${s.name}: índice ${s.index}, abaixo dos colegas em todos os dias`,d:`Dias: ${s.perDay.filter(p=>!p.off).map(p=>p.index).join(', ')}. ${s.psc.toFixed(1)} fotos vendidas por venda e R$ ${Math.round(s.rpc)} por sessão. O problema está na venda, não só no volume.`});
    const last=s.perDay.filter(p=>!p.off).slice(-2);if(last.length===2&&last.every(p=>p.index<95)&&s.index>=95)out.push({sev:'warn',t:`${s.name}: caiu nos dois últimos dias`,d:`Índice ${last.map(p=>p.index).join(' e ')} depois de uma semana na média ou acima.`});
  }
  Object.entries(unlinked).forEach(([kd,n])=>{const [k,d]=kd.split('|');const ses=DATA.sessions.filter(s=>s.key===k&&s.date===d&&s.card).length||1;const r=n/ses;if(r>=2)out.push({sev:r>=3?'bad':'warn',t:`${P[k].name}: ${n} fotos fora de sessão em ${dlabel(d)}, ${r.toFixed(1)} por grupo`,d:`Separação automática resolve; conferir no Upload automático e na Qualidade.`})});
  if(state.simCheio)out.push({sev:'bad',t:'Armazenamento do navegador cheio: o Eterna não conseguiu gravar',d:'Vendas e pendências desta janela podem não estar salvas. Feche abas antigas do Eterna e avise a TI antes de continuar vendendo.'});
  if(state.janelaAntiga)out.push({sev:'bad',t:'Há uma janela antiga do Eterna aberta',d:'Recarregue as outras janelas do Eterna neste computador para não perder o caixa.'});
  dinAbertas().filter(r=>dinMin(r)>CAIXA_ALERTA_MIN).forEach(r=>{const m=meioDe(r);out.push({sev:'bad',t:m==='dinheiro'?`Dinheiro esperando no caixa há ${dinMin(r)} min · código ${r.codigo}`:`${MEIO_NOME[m]} esperando a confirmação da maquininha há ${dinMin(r)} min · código ${r.codigo}`,d:`${fmtR(r.total)}, ${r.n} ${r.n===1?'foto':'fotos'}. Confirme o pagamento ou cancele no Posto de venda.`});});
  // v83: venda paga sem impressão, impressões sem foto (semFoto) e rolo baixo, por posto
  Object.entries(SIM.sessions).forEach(([c,s])=>{const im=s.impressao;if(s.status!=='paga'||!im)return;const min=s.paidAt?Math.floor((now()-new Date(s.paidAt))/60000):0;
    if(im.estado==='pendente'&&min>IMP_ALERTA_MIN&&min<24*60)out.push({sev:'warn',t:`Venda ${s.saleNo||c} paga há ${min} min e ainda sem impressão`,d:`${s.posto||postoNome()}: imprima as fotos no Posto de venda ou marque "Não saiu" para registrar o problema.`});
    if(im.semFoto>0&&isoDia(s.paidAt||0)===todayISO())out.push({sev:'bad',t:`Venda ${s.saleNo||c}: ${im.semFoto} ${im.semFoto===1?'impressão':'impressões'} sem foto`,d:'O pacote prevê mais impressões do que fotos escolhidas. Combine com o cliente.'});});
  Object.entries(SIM.stock||{}).forEach(([k,v])=>{if(v<ROLO_ALERTA)out.push({sev:'warn',t:`${k}: rolo com ${v} impressões`,d:'Trocar o rolo da DNP antes do pico e registrar a troca em Estoque.'});});
  flagList().forEach(x=>{if(!x[5]||!x[3])return;const st=flagOf(x),fs=flagStats(x);if(st.state==='defeito'||st.state==='fora de uso')out.push({sev:'warn',t:`Bandeira ${x[1]}: ${st.state}${st.note?', '+st.note:''}`,d:`${x[3]===1?'Peça única. ':''}Repor antes do fim de semana.`});else if(x[3]===1&&fs.sessions>=100)out.push({sev:'warn',t:`Bandeira ${x[1]}: peça única com ${fs.sessions} sessões na semana`,d:'Em dia de jogo falta. Comprar a segunda unidade.'});});
  out.push({sev:'warn',t:'Escala: 25 turnos para 28 necessários',d:'Quatro pontos por sete dias com cinco pessoas em 5x2 deixa 3 turnos descobertos; com o vestiário, 10.'});
  const best=humans.map(k=>stats[k]).sort((a,b)=>b.index-a.index)[0];out.push({sev:'good',t:`${best.name} lidera a semana com índice ${best.index}`,d:`${fmtR(best.revenue)} em ${best.days} dias, ticket ${fmtR(best.ticket)}.`});
  const order={bad:0,warn:1,good:2};return out.sort((a,b)=>order[a.sev]-order[b.sev]);
}

  const r=await mailApi('/auth/codigo',{email:e});state.auth.busy=false;
  if(r.status===429){state.auth.err='Aguarde um pouco antes de pedir outro código.';render();return;}
  if(r.status===400){state.auth.err='Digite um e-mail válido.';render();return;}
  const real=r.status===202;const code=real?null:String(Math.floor(100000+Math.random()*900000));
  state.auth.pending={email:e,code,real,at:now().toISOString(),exp:new Date(now().getTime()+10*60e3).toISOString()};state.auth.step='code';state.auth.code='';state.auth.err=null;render();const i=$('[data-act="login-code"]');if(i)i.focus();}

    if(r.status===200&&r.ok){try{localStorage.setItem('eterna.token',r.token)}catch(e){}login(p.email);return;}
    if(r.erro==='expirado'){state.auth.err='Código expirado. Peça outro.';state.auth.step='email';state.auth.pending=null;render();return;}
    state.auth.err=r.status===0?'Sem conexão. Tente de novo.':'Código incorreto.';render();return;}

AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Eterna · borda da galeria (17/11): CloudFront na frente da API da galeria com o firewall (WAF). A API HTTP do API Gateway
  não aceita WAF direto; por isso o filtro fica no CloudFront. Stack em us-east-1 (exigência do WAF de CloudFront).
  Instalação e passos: servidor/galeria-nuvem/README.md, seção "Firewall (WAF)".

Parameters:
  ApiDominio:
    Type: String
    Default: whe2hyve2j.execute-api.us-east-2.amazonaws.com
    Description: domínio da API da galeria (saída EnderecoApi da stack eterna-galeria, sem https://)
  SegredoOrigem:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: segredo que o CloudFront manda para a API (cabeçalho x-eterna-origem); a API guarda só o SHA-256
  ModoRegras:
    Type: String
    Default: contar
    AllowedValues: [contar, bloquear]
    Description: regras prontas da AWS só contando (primeiros dias, para ver falso positivo) ou bloqueando
  LimiteMinuto:
    Type: Number
    Default: 300
    MinValue: 10
    Description: pedidos por minuto por IP; acima disso o IP fica bloqueado enquanto passar do limite

Conditions:
  Contar: !Equals [!Ref ModoRegras, contar]

Resources:
  Firewall:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: eterna-galeria
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: eterna-galeria}
      CustomResponseBodies:
        excesso: {ContentType: APPLICATION_JSON, Content: '{"motivo":"excesso"}'}
      Rules:
        - Name: excesso-por-ip
          Priority: 0
          Action: {Block: {CustomResponse: {ResponseCode: 429, CustomResponseBodyKey: excesso}}}
          Statement:
            RateBasedStatement: {Limit: !Ref LimiteMinuto, EvaluationWindowSec: 60, AggregateKeyType: IP}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: excesso-por-ip}
        - Name: ip-de-ma-fama
          Priority: 1
          OverrideAction: !If [Contar, {Count: {}}, {None: {}}]
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ip-de-ma-fama}
        - Name: entradas-maliciosas
          Priority: 2
          OverrideAction: !If [Contar, {Count: {}}, {None: {}}]
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: entradas-maliciosas}
        - Name: ataques-comuns
          Priority: 3
          OverrideAction: !If [Contar, {Count: {}}, {None: {}}]
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              # a selfie vai no corpo do pedido (bem mais que 8 KB): o limite de tamanho do corpo só conta, nunca bloqueia
              RuleActionOverrides:
                - Name: SizeRestrictions_BODY
                  ActionToUse: {Count: {}}
          VisibilityConfig: {SampledRequestsEnabled: true, CloudWatchMetricsEnabled: true, MetricName: ataques-comuns}

  # o que chega à API: só o que ela lê, mais o IP do celular escrito pelo próprio CloudFront (não dá para falsificar)
  Repasse:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: eterna-galeria-repasse
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type, X-Eterna-Ponto, Access-Control-Request-Method, Access-Control-Request-Headers, CloudFront-Viewer-Address]
        QueryStringsConfig: {QueryStringBehavior: all}
        CookiesConfig: {CookieBehavior: none}

  Borda:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: eterna-galeria (API da galeria com WAF)
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        WebACLId: !GetAtt Firewall.Arn
        Origins:
          - Id: api
            DomainName: !Ref ApiDominio
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
            OriginCustomHeaders:
              - {HeaderName: x-eterna-origem, HeaderValue: !Ref SegredoOrigem}
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad      # CachingDisabled (gerenciada pela AWS)
          OriginRequestPolicyId: !Ref Repasse
          Compress: true

Outputs:
  EnderecoBorda:
    Description: endereço da galeria com o firewall (vai no GAL_API do app e no ETERNA_GALERIA_API do servidor)
    Value: !Sub "https://${Borda.DomainName}"

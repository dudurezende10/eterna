AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Eterna - galeria na nuvem (plano v85, parte F). API do celular do cliente, banco e permissões mínimas.

Parameters:
  Bucket:
    Type: String
    Description: bucket das fotos (vitrine/ e alta/), o mesmo para onde o agente do estádio envia
  SegredoPontoSha256:
    Type: String
    NoEcho: true
    Description: SHA-256 do segredo do ponto (o segredo fica só no agente, em ~/Eterna/nuvem-segredo.txt)
  SegredoPontoTesteSha256:
    Type: String
    NoEcho: true
    Default: ""
    Description: SHA-256 do segredo do servidor de teste; vazio = só o segredo do estádio publica
  CompraOnline:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: compra online pela Imply (v99); só liga de fato com ImplyChaveParametro e ImplyTipoPessoa preenchidos
  RdChaveParametro:
    Type: String
    Default: "/eterna/rdstation-chave"
    Description: parâmetro SecureString do SSM com a chave da API de conversões do RD Station (25/11). Sem o parâmetro no SSM, os leads esperam na fila; vazio desliga. A chave nunca vai no template
  RdAppParametro:
    Type: String
    Default: "/eterna/rd-app"
    Description: SecureString do SSM com o aplicativo Eterna do RD Station, JSON {"client_id", "client_secret"} (26/11, OAuth para saber se o lead é novo); vazio desliga a consulta
  RdRefreshParametro:
    Type: String
    Default: "/eterna/rd-oauth-refresh"
    Description: SecureString do SSM onde a nuvem guarda o refresh_token do RD (gravado por /rd/callback)
  RdEstadoParametro:
    Type: String
    Default: "/eterna/rd-oauth-estado"
    Description: SecureString do SSM com o state do link de autorização (gravado à mão antes de autorizar; a nuvem troca por "usado")
  ImplyChaveParametro:
    Type: String
    Default: ""
    Description: nome do parâmetro SecureString do SSM com a chave do usuário de serviço da Imply (ex. /eterna/imply-chave); a chave nunca vai no template
  ImplyTipoPessoa:
    Type: String
    Default: "100001"
    Description: "código tipo_pessoa da Eleven; comprador de fotos = Público Geral (PG) 100001 (documentação da Imply de 18/11)"
  ImplyConsulta:
    Type: String
    Default: ""
    Description: endereço do GetCart da Imply (vazio = <admin>/api/SuperIngressoV02/v01/GetCart/, seção 7 da documentação de 23/11)
  ImplyProdutoCampo:
    Type: String
    Default: idproduto
    AllowedValues: [idproduto, depara]
    Description: como o produto vai no predefined-cart (o SKU do catálogo é o idproduto da Imply)
  OrigemSha256:
    Type: String
    Default: ""
    Description: SHA-256 do SegredoOrigem da stack eterna-galeria-borda (vazio = sem borda)
  ExigirBorda:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: 1 recusa pedido que não passou pelo CloudFront com o firewall (ligar depois que app e servidor usarem a borda)
  OrigensApp:
    Type: CommaDelimitedList
    Default: "https://eterna.photo,https://www.eterna.photo,http://127.0.0.1:8765,http://localhost:8765,http://192.168.10.218:8765"
  MailFrom:
    Type: String
    Default: ""
    Description: remetente do código de acesso do login (domínio verificado no Amazon SES)
  MailDominio:
    Type: String
    Default: "vivamaracana.com.br"
    Description: domínio verificado no Amazon SES (a função só pode enviar por ele)
  LimiteLeiturasDia:
    Type: Number
    Default: 60000
    Description: teto de fotos lidas pelo Rekognition por dia (US$ 0,001 cada; 17/11 escola - galeria comum mais 4 janelas de escola cheias)
  LimiteBuscasDia:
    Type: Number
    Default: 20000
    Description: teto de selfies comparadas por dia (US$ 0,001 cada)
  LimiteFotosEscola:
    Type: Number
    Default: 10000
    Description: teto de fotos lidas numa galeria de escola pelo voucher (uma janela de 2h30 no pico, com folga)
  EscolaLotes:
    Type: Number
    Default: 8
    Description: leituras em paralelo da galeria de escola (o Rekognition segura o ritmo pela cota da conta)
  EmailOrcamento:
    Type: String
    Default: ""
    Description: e-mail que recebe o alerta de orçamento da conta (vazio = sem alerta)
  OrcamentoMensalUsd:
    Type: Number
    Default: 300
    Description: orçamento mensal da conta em dólar; alerta em 80% do gasto real e em 100% da previsão

Conditions:
  TemEmail: !Not [!Equals [!Ref EmailOrcamento, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 512

Resources:
  Banco:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: eterna-galeria
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
      Tags: [{Key: projeto, Value: eterna}]

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref OrigensApp
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 3600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  Galeria:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: eterna-galeria
      CodeUri: .
      Handler: app.handler
      Environment:
        Variables:
          TABELA: !Ref Banco
          BUCKET: !Ref Bucket
          SEGREDO_PONTO_SHA256: !Ref SegredoPontoSha256
          ORIGEM_SHA256: !Ref OrigemSha256
          EXIGIR_BORDA: !Ref ExigirBorda
          SEGREDO_PONTO_TESTE_SHA256: !Ref SegredoPontoTesteSha256
          COMPRA_ONLINE: !Ref CompraOnline
          IMPLY_CHAVE_SSM: !Ref ImplyChaveParametro
          RD_CHAVE_PARAMETRO: !Ref RdChaveParametro
          RD_APP_PARAMETRO: !Ref RdAppParametro
          RD_REFRESH_PARAMETRO: !Ref RdRefreshParametro
          RD_ESTADO_PARAMETRO: !Ref RdEstadoParametro
          IMPLY_TIPO_PESSOA: !Ref ImplyTipoPessoa
          IMPLY_CONSULTA: !Ref ImplyConsulta
          IMPLY_PRODUTO_CAMPO: !Ref ImplyProdutoCampo
          VOLTA_URL: https://eterna.photo/g/
          LIMIAR_ADULTO: "85"
          LIMIAR_CRIANCA: "95"
          COLECAO_PREFIXO: et-maracana-
          LIMITE_FOTOS_GALERIA: "600"
          LIMITE_LEITURAS_DIA: !Ref LimiteLeiturasDia
          LIMITE_BUSCAS_DIA: !Ref LimiteBuscasDia
          LIMITE_FOTOS_ESCOLA: !Ref LimiteFotosEscola
          ESCOLA_LOTES: !Ref EscolaLotes
          MAIL_FROM: !Ref MailFrom
          MAIL_NOME: "Viva Maracanã · Eterna"
          AUDITORIA_PARA: ronaldo.santos@maracatour.com.br
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Banco}
        - Statement:
            - Sid: FotosSoLeitura
              Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "arn:aws:s3:::${Bucket}/*"
            - Sid: RostosDaGaleria
              Effect: Allow
              Action: [rekognition:CreateCollection, rekognition:IndexFaces, rekognition:SearchFacesByImage, rekognition:DeleteCollection]
              Resource: !Sub "arn:aws:rekognition:${AWS::Region}:${AWS::AccountId}:collection/et-maracana-*"
            - Sid: CodigoDeAcessoPorEmail
              Effect: Allow
              Action: [ses:SendEmail]
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
              Condition:
                StringLike:
                  ses:FromAddress: !Sub "*@${MailDominio}"
            - Sid: LimpezaDosRostos
              Effect: Allow
              Action: [rekognition:ListCollections]
              Resource: "*"
            - Sid: UmaPessoaPorVez
              Effect: Allow
              Action: [rekognition:DetectFaces]
              Resource: "*"
            - Sid: ChavesDaImplyEdoRd
              Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/eterna/*"
            - Sid: TokenDoRd                                  # 26/11: só a nuvem grava o refresh_token e queima o state
              Effect: Allow
              Action: [ssm:PutParameter]
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/eterna/rd-oauth-refresh"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/eterna/rd-oauth-estado"
            - Sid: LeituraEmSegundoPlano
              Effect: Allow
              Action: [lambda:InvokeFunction]
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:eterna-galeria"
      Events:
        Limpeza:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)
            Input: '{"limpeza": true}'
        ConferePedidos:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"conferir": true}'
        PedidoVolta:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: "/g/pedido/{ref}"
            Method: GET
        VendasOnline:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ponto/vendas-online
            Method: GET
        CompraLer:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ponto/compra
            Method: GET
        CompraGravar:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ponto/compra
            Method: POST
        Codigo:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: "/g/codigo/{codigo}"
            Method: GET
        Info:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: "/g/{token}/info"
            Method: GET
        Livres:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: "/g/{token}/livres"
            Method: GET
        VideoBaixar:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: "/g/{token}/baixar"
            Method: GET
        EventosPonto:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ponto/eventos
            Method: GET
        EscolasPonto:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ponto/escolas
            Method: GET
        LeadsPonto:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ponto/leads
            Method: GET
        RdCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /rd/callback
            Method: GET
        Acoes:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: "/g/{token}/{acao}"
            Method: POST
        Login:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: "/auth/{acao}"
            Method: POST
        AuditoriaPonto:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ponto/auditoria
            Method: POST
        Publicar:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /ponto/galerias
            Method: POST

  Orcamento:
    Type: AWS::Budgets::Budget
    Condition: TemEmail
    Properties:
      Budget:
        BudgetName: eterna-mensal
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref OrcamentoMensalUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref EmailOrcamento}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref EmailOrcamento}]

Outputs:
  EnderecoApi:
    Description: endereço da API (até existir api.eterna.photo)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
